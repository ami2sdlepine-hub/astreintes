<style>
/* ============================================================================
   DESIGN SYSTEM — Astreintes AMI2S v2.0
   Inspirations: Linear, Stripe Dashboard, Vercel
============================================================================ */

:root {
  /* === LIGHT MODE (par défaut) === */
  --bg: #ffffff;
  --bg-elevated: #ffffff;
  --bg-subtle: #f8fafc;
  --bg-muted: #f1f5f9;
  --bg-hover: #e2e8f0;
  
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  
  --text: #0f172a;
  --text-secondary: #475569;
  --text-tertiary: #94a3b8;
  --text-on-accent: #ffffff;
  
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-subtle: #eff6ff;
  --accent-border: #bfdbfe;
  
  --status-call: #0284c7;
  --status-call-bg: #f0f9ff;
  --status-call-border: #bae6fd;
  
  --status-intervention: #d97706;
  --status-intervention-bg: #fffbeb;
  --status-intervention-border: #fde68a;
  
  --status-done: #059669;
  --status-done-bg: #ecfdf5;
  --status-done-border: #a7f3d0;
  
  --status-chain: #7c3aed;
  --status-chain-bg: #f5f3ff;
  --status-chain-border: #ddd6fe;
  
  --danger: #dc2626;
  --danger-bg: #fef2f2;
  --danger-border: #fecaca;
  
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 1px 2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 10px 25px rgba(15, 23, 42, 0.10), 0 4px 6px rgba(15, 23, 42, 0.05);
  --shadow-xl: 0 20px 40px rgba(15, 23, 42, 0.15);
  
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  
  --transition: 150ms cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg: #0f172a;
  --bg-elevated: #1e293b;
  --bg-subtle: #1e293b;
  --bg-muted: #334155;
  --bg-hover: #475569;
  
  --border: #334155;
  --border-strong: #475569;
  
  --text: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-tertiary: #94a3b8;
  --text-on-accent: #ffffff;
  
  --accent: #3b82f6;
  --accent-hover: #60a5fa;
  --accent-subtle: rgba(59, 130, 246, 0.10);
  --accent-border: rgba(59, 130, 246, 0.30);
  
  --status-call: #38bdf8;
  --status-call-bg: rgba(56, 189, 248, 0.10);
  --status-call-border: rgba(56, 189, 248, 0.30);
  
  --status-intervention: #fbbf24;
  --status-intervention-bg: rgba(251, 191, 36, 0.10);
  --status-intervention-border: rgba(251, 191, 36, 0.30);
  
  --status-done: #34d399;
  --status-done-bg: rgba(52, 211, 153, 0.10);
  --status-done-border: rgba(52, 211, 153, 0.30);
  
  --status-chain: #a78bfa;
  --status-chain-bg: rgba(167, 139, 250, 0.10);
  --status-chain-border: rgba(167, 139, 250, 0.30);
  
  --danger: #f87171;
  --danger-bg: rgba(248, 113, 113, 0.10);
  --danger-border: rgba(248, 113, 113, 0.30);
  
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.4), 0 4px 6px rgba(0, 0, 0, 0.2);
  --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background var(--transition), color var(--transition);
}

body { font-size: 15px; line-height: 1.5; }

#app {
  max-width: 500px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
  padding-bottom: 80px;
}

/* ============================================================================
   HEADER
============================================================================ */
.app-header {
  position: sticky;
  top: 0;
  padding: max(env(safe-area-inset-top, 0px), 12px) 20px 12px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 50;
}
[data-theme="dark"] .app-header { background: rgba(15, 23, 42, 0.85); }

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.header-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}
.header-back {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  color: var(--text);
  cursor: pointer;
  margin-left: -8px;
  font-size: 22px;
  transition: background var(--transition);
}
.header-back:active { background: var(--bg-muted); }
.header-subtitle {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 1px;
  font-weight: 500;
}
.header-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: transparent;
  border: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
}
.icon-btn:active { background: var(--bg-muted); }
.icon-btn.primary { background: var(--accent); color: var(--text-on-accent); }
.icon-btn.primary:active { background: var(--accent-hover); }

/* ============================================================================
   WEEK BANNER
============================================================================ */
.week-banner {
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.week-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.week-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
}
.week-dates {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.week-count {
  text-align: right;
}
.week-count-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}
.week-count-label {
  font-size: 10px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
  margin-top: 4px;
}

/* ============================================================================
   SEQUENCE INDICATOR (séquence ouverte)
============================================================================ */
.sequence-indicator {
  margin: 12px 20px 0;
  padding: 12px 14px;
  background: var(--status-chain-bg);
  border: 1px solid var(--status-chain-border);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  gap: 10px;
}
.sequence-pulse {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--status-chain);
  position: relative;
  flex-shrink: 0;
}
.sequence-pulse::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--status-chain);
  animation: pulse 2s ease-out infinite;
  opacity: 0.6;
}
@keyframes pulse {
  to { transform: scale(2.5); opacity: 0; }
}
.sequence-text {
  flex: 1;
  font-size: 12px;
  color: var(--status-chain);
  font-weight: 600;
}
.sequence-text strong { display: block; font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.sequence-action {
  font-size: 11px;
  color: var(--status-chain);
  font-weight: 700;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(124, 58, 237, 0.1);
}

/* ============================================================================
   FILTERS / SEGMENTED CONTROL
============================================================================ */
.filter-tabs {
  display: flex;
  gap: 6px;
  padding: 14px 20px 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
  padding: 7px 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
}
.filter-tab.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.filter-tab-count {
  display: inline-block;
  margin-left: 4px;
  font-family: 'JetBrains Mono', monospace;
  opacity: 0.7;
  font-size: 11px;
}

/* ============================================================================
   DOSSIER CARDS
============================================================================ */
.dossiers-list {
  padding: 8px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dossier {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.dossier::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--border-strong);
}
.dossier.status-call::before { background: var(--status-call); }
.dossier.status-intervention::before { background: var(--status-intervention); }
.dossier.status-done::before { background: var(--status-done); }
.dossier.status-pending::before { background: var(--text-tertiary); }
.dossier:active { transform: scale(0.99); background: var(--bg-subtle); }

.dossier-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 6px;
}
.dossier-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 600;
}
.dossier-badges { display: flex; gap: 4px; flex-shrink: 0; }
.badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 3px 8px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.badge-call { background: var(--status-call-bg); color: var(--status-call); border: 1px solid var(--status-call-border); }
.badge-intervention { background: var(--status-intervention-bg); color: var(--status-intervention); border: 1px solid var(--status-intervention-border); }
.badge-done { background: var(--status-done-bg); color: var(--status-done); border: 1px solid var(--status-done-border); }
.badge-pending { background: var(--bg-muted); color: var(--text-secondary); border: 1px solid var(--border); }
.badge-chain { background: var(--status-chain-bg); color: var(--status-chain); border: 1px solid var(--status-chain-border); }

.dossier-etablissement {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 3px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.dossier-motif {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.4;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.dossier-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--text-tertiary);
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
.dossier-meta span { display: flex; align-items: center; gap: 4px; font-weight: 500; }

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-tertiary);
}
.empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-state-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.empty-state-desc { font-size: 13px; line-height: 1.5; max-width: 240px; margin: 0 auto; }

/* ============================================================================
   FAB
============================================================================ */
.fab {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 300;
  box-shadow: var(--shadow-lg), 0 0 0 4px var(--bg);
  cursor: pointer;
  z-index: 40;
  border: none;
  line-height: 1;
  transition: transform var(--transition);
}
.fab:active { transform: scale(0.95); }

/* ============================================================================
   BOTTOM NAV
============================================================================ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 500px;
  margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 50;
}
[data-theme="dark"] .bottom-nav { background: rgba(15, 23, 42, 0.92); }
.nav-item {
  flex: 1;
  height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--text-tertiary);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  padding: 6px;
  border: none;
  background: transparent;
  transition: color var(--transition);
}
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 22px; line-height: 1; }

/* ============================================================================
   FORMS
============================================================================ */
.form-screen { padding: 16px 20px 120px; }

.section {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
}

.section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 14px;
}

.form-group { margin-bottom: 14px; }
.form-group:last-child { margin-bottom: 0; }

.form-label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  font-weight: 600;
}
.required { color: var(--danger); }

.form-input, .form-textarea, .form-select {
  width: 100%;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 14px;
  font-size: 15px;
  color: var(--text);
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color var(--transition), background var(--transition);
}
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-tertiary); }
.form-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-elevated);
}

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ============================================================================
   PICKER BUTTONS (date/time custom)
============================================================================ */
.picker-btn {
  width: 100%;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 14px;
  font-size: 15px;
  color: var(--text);
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all var(--transition);
  font-variant-numeric: tabular-nums;
}
.picker-btn:active { background: var(--bg-muted); }
.picker-btn-icon { color: var(--text-tertiary); font-size: 16px; }
.picker-btn .rounded-pill {
  font-size: 9px;
  background: var(--accent);
  color: var(--text-on-accent);
  padding: 2px 6px;
  border-radius: 100px;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin-left: 6px;
}

/* ============================================================================
   TYPE SELECTOR (Tel / Déplacement)
============================================================================ */
.type-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.type-option {
  background: var(--bg-subtle);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 12px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
}
.type-option:active { transform: scale(0.97); }
.type-option.selected.phone {
  background: var(--status-call-bg);
  border-color: var(--status-call);
}
.type-option.selected.move {
  background: var(--status-intervention-bg);
  border-color: var(--status-intervention);
}
.type-option .icon { font-size: 28px; margin-bottom: 6px; display: block; }
.type-option .label { font-size: 13px; font-weight: 700; color: var(--text); }
.type-option .desc { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

/* ============================================================================
   RADIO OPTIONS
============================================================================ */
.radio-group { display: flex; flex-direction: column; gap: 8px; }
.radio-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
}
.radio-option:active { transform: scale(0.98); }
.radio-option.selected {
  border-color: var(--accent);
  background: var(--accent-subtle);
}
.radio-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  flex-shrink: 0;
  position: relative;
  transition: border-color var(--transition);
}
.radio-option.selected .radio-dot { border-color: var(--accent); }
.radio-option.selected .radio-dot::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
.radio-icon { font-size: 20px; }
.radio-content { flex: 1; }
.radio-title { font-size: 14px; font-weight: 600; color: var(--text); }
.radio-subtitle { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* ============================================================================
   TIMESTAMPS
============================================================================ */
.timestamp-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 12px 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  transition: all var(--transition);
}
.timestamp-row.pending {
  border-color: var(--accent);
  background: var(--accent-subtle);
}
.timestamp-row.disabled { opacity: 0.5; }
.timestamp-row.crossed {
  background: var(--bg-muted);
  border-style: dashed;
}
.timestamp-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.timestamp-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.ts-actions { display: flex; gap: 4px; align-items: center; }
.ts-btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 9px 16px;
  border-radius: 8px;

<script>
'use strict';

// ============================================================================
// ASTREINTES AMI2S v2.0
// ============================================================================

// ----------------------------------------------------------------------------
// UTILITAIRES
// ----------------------------------------------------------------------------
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).substring(2, 9);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function roundTo5(date) {
  const d = new Date(date);
  const rounded = Math.round(d.getMinutes() / 5) * 5;
  d.setMinutes(rounded); d.setSeconds(0); d.setMilliseconds(0);
  return d;
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fmtDateShort(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}
function fmtTime(d) {
  if (!d) return '—';
  return new Date(d).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function fmtDateTime(d) { return fmtDate(d) + ' • ' + fmtTime(d); }

function fmtDuration(ms) {
  if (!ms || ms < 0) return '—';
  const total = Math.round(ms / 60000);
  const h = Math.floor(total / 60);
  const m = total % 60;
  return `${h}h${m.toString().padStart(2, '0')}`;
}

function diffMs(start, end) {
  if (!start || !end) return 0;
  return new Date(end) - new Date(start);
}

function getAstreinteWeek(date = new Date()) {
  const d = new Date(date);
  const day = d.getDay();
  const hours = d.getHours();
  let daysToMonday;
  if (day === 1 && hours < 9) daysToMonday = -7;
  else if (day === 0) daysToMonday = -6;
  else daysToMonday = -(day - 1);
  
  const start = new Date(d);
  start.setDate(d.getDate() + daysToMonday);
  start.setHours(9, 0, 0, 0);
  const end = new Date(start);
  end.setDate(start.getDate() + 7);
  
  const yearStart = new Date(start.getFullYear(), 0, 1);
  const daysSinceYearStart = Math.floor((start - yearStart) / 86400000);
  const weekNumber = Math.ceil((daysSinceYearStart + yearStart.getDay()) / 7);
  
  return { start, end, weekNumber };
}

function haptic(type = 'light') {
  if (!('vibrate' in navigator)) return;
  const patterns = { light: 10, medium: 20, heavy: [10, 30, 10], success: [10, 30, 10, 30, 10] };
  navigator.vibrate(patterns[type] || 10);
}

// ----------------------------------------------------------------------------
// STORAGE — IndexedDB
// ----------------------------------------------------------------------------
const DB_NAME = 'astreintes_ami2s';
const DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('dossiers')) {
        const store = database.createObjectStore('dossiers', { keyPath: 'id' });
        store.createIndex('dateAppel', 'dateAppel');
        store.createIndex('sequenceId', 'sequenceId');
      }
      if (!database.objectStoreNames.contains('settings')) {
        database.createObjectStore('settings', { keyPath: 'key' });
      }
    };
  });
}

function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(store, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function dbClear(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ----------------------------------------------------------------------------
// STATE
// ----------------------------------------------------------------------------
const DEFAULT_SETTINGS = {
  technicien: '',
  email: '',
  emailDestinataire: '',
  adresseDomicile: '',
  statutSemaine: 'titulaire',
  arrondi: 5,
  rappelHeure: '08:00',
  rappelActif: true,
  theme: 'auto',
  googleMapsApiKey: '',
  syncUrl: '',
  syncToken: '',
  syncEnabled: false,
  lastSync: null
};

let state = {
  settings: { ...DEFAULT_SETTINGS },
  dossiers: []
};

async function loadState() {
  await openDB();
  const settingsRow = await dbGet('settings', 'main');
  if (settingsRow) state.settings = { ...DEFAULT_SETTINGS, ...settingsRow.value };
  state.dossiers = await dbGetAll('dossiers');
  applyTheme();
}

async function saveSettings() {
  await dbPut('settings', { key: 'main', value: state.settings });
}

async function saveDossier(d) {
  d.updatedAt = new Date().toISOString();
  await dbPut('dossiers', d);
  // Update in memory
  const idx = state.dossiers.findIndex(x => x.id === d.id);
  if (idx >= 0) state.dossiers[idx] = d;
  else state.dossiers.push(d);
  // Trigger sync if enabled
  scheduleSync();
}

async function deleteDossier(id) {
  await dbDelete('dossiers', id);
  state.dossiers = state.dossiers.filter(d => d.id !== id);
  scheduleSync();
}

// ----------------------------------------------------------------------------
// THEME MANAGEMENT
// ----------------------------------------------------------------------------
function applyTheme() {
  const theme = state.settings.theme || 'auto';
  let actualTheme = theme;
  if (theme === 'auto') {
    actualTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  document.documentElement.setAttribute('data-theme', actualTheme);
  const meta = $('#theme-color-meta');
  if (meta) meta.content = actualTheme === 'dark' ? '#0f172a' : '#ffffff';
}

if (window.matchMedia) {
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (state.settings.theme === 'auto') applyTheme();
  });
}

// ----------------------------------------------------------------------------
// SYNC (Apps Script backend)
// ----------------------------------------------------------------------------
let syncTimeout = null;
function scheduleSync() {
  if (!state.settings.syncEnabled || !state.settings.syncUrl) return;
  syncStatus = 'pending';
  updateSyncBadge();
  if (syncTimeout) clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => doSync(), 3000);
}

async function doSync(showFeedback = false) {
  if (!state.settings.syncEnabled || !state.settings.syncUrl) {
    syncStatus = 'off';
    updateSyncBadge();
    return;
  }
  
  syncStatus = 'pending';
  updateSyncBadge();
  
  try {
    const payload = {
      token: state.settings.syncToken,
      action: 'sync',
      technicien: state.settings.technicien,
      dossiers: state.dossiers,
      settings: state.settings,
      clientTime: new Date().toISOString()
    };
    
    const response = await fetch(state.settings.syncUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const result = await response.json();
    if (result.error) throw new Error(result.error);
    
    state.settings.lastSync = new Date().toISOString();
    await saveSettings();
    syncStatus = 'ok';
    updateSyncBadge();
    
    if (showFeedback) {
      toast('Synchronisation réussie • ' + (result.count || 0) + ' dossiers', 'success');
    }
  } catch (err) {
    console.error('Sync error', err);
    syncStatus = 'error';
    updateSyncBadge();
    if (showFeedback) toast('Erreur de sync : ' + err.message, 'error');
  }
}

function updateSyncBadge() {
  // Met à jour le badge sync dans Réglages si visible
  const badge = $('#sync-badge');
  if (badge) badge.outerHTML = renderSyncBadge();
}

function renderSyncBadge() {
  if (!state.settings.syncEnabled) return `<span class="sync-badge off" id="sync-badge"><span class="sync-dot"></span>Désactivé</span>`;
  const map = {
    ok: `<span class="sync-badge ok" id="sync-badge"><span class="sync-dot"></span>Synchronisé</span>`,
    pending: `<span class="sync-badge pending" id="sync-badge"><span class="sync-dot"></span>En cours...</span>`,
    error: `<span class="sync-badge error" id="sync-badge"><span class="sync-dot"></span>Erreur</span>`,
    off: `<span class="sync-badge off" id="sync-badge"><span class="sync-dot"></span>Non configuré</span>`
  };
  return map[syncStatus] || map.off;
}

// ----------------------------------------------------------------------------
// BUSINESS LOGIC
// ----------------------------------------------------------------------------
function getWeekDossiers(offset = 0) {
  const base = new Date();
  base.setDate(base.getDate() + offset * 7);
  const { start, end } = getAstreinteWeek(base);
  return state.dossiers.filter(d => {
    const dt = new Date(d.dateAppel);
    return dt >= start && dt < end;
  });
}

function getFilteredDossiers() {
  let dossiers = view.weekOffset !== null ? getWeekDossiers(view.weekOffset) : state.dossiers;
  dossiers = [...dossiers].sort((a, b) => new Date(b.dateAppel) - new Date(a.dateAppel));
  
  if (view.filter === 'all') return dossiers;
  if (view.filter === 'en-cours') return dossiers.filter(d => d.statut === 'intervention');
  if (view.filter === 'appels') return dossiers.filter(d => d.type === 'telephone');
  if (view.filter === 'clotures') return dossiers.filter(d => d.statut === 'cloture');
  return dossiers;
}

function getDossierStatus(d) {
  if (d.type === 'telephone') return d.statut === 'cloture' ? 'call-closed' : 'pending';
  if (d.statut === 'cloture') return 'done';
  if (d.statut === 'intervention') return 'intervention';
  return 'pending';
}

function getBadge(d) {
  const s = getDossierStatus(d);
  switch (s) {
    case 'call-closed': return { class: 'badge-call', text: '☎ Téléphone', card: 'status-call' };
    case 'intervention': return { class: 'badge-intervention', text: '⚠ En cours', card: 'status-intervention' };
    case 'done': return { class: 'badge-done', text: '✓ Clôturé', card: 'status-done' };
    default: return { class: 'badge-pending', text: '◷ En attente', card: 'status-pending' };
  }
}

function findOpenSequence() {
  // Cherche un dossier sans retour domicile mais avec départ
  const openDossiers = state.dossiers.filter(d =>
    d.departDomicile && !d.retourDomicile && d.sequenceId
  );
  if (openDossiers.length === 0) return null;
  
  // Pour chaque sequenceId trouvé, vérifier qu'aucun dossier de la séquence n'a de retour
  const candidates = new Set(openDossiers.map(d => d.sequenceId));
  for (const seqId of candidates) {
    const all = state.dossiers.filter(d => d.sequenceId === seqId);
    const hasRetour = all.some(d => d.retourDomicile);
    if (!hasRetour) return { sequenceId: seqId, dossiers: all };
  }
  return null;
}

function recalcDurations(d) {
  if (d.arriveeSite && d.departSite) {
    d.tempsSiteMs = diffMs(d.arriveeSite, d.departSite);
    d.tempsSiteCalcule = fmtDuration(d.tempsSiteMs);
  }
  if (d.departDomicile && d.retourDomicile) {
    d.totalTrajetMs = diffMs(d.departDomicile, d.retourDomicile);
    d.totalTrajetCalcule = fmtDuration(d.totalTrajetMs);
  }
}

function renderDetailHoraires(d) {

            </div>

      ` : ''}
    </div>

function renderTimestamp(d, field, label, icon) {
  const value = d[field];
  const isFilled = !!value;
  
  let disabled = false;
  if (field === 'arriveeSite' && !d.departDomicile && d.pointDepart === 'domicile') disabled = true;
  if (field === 'departSite' && !d.arriveeSite) disabled = true;
  if (field === 'retourDomicile' && !d.departSite) disabled = true;
  
  return `
    <div class="timestamp-row ${isFilled ? '' : disabled ? 'disabled' : 'pending'}">
      <div>
        <div class="timestamp-label">${icon} ${label}</div>
        <div class="timestamp-sub">${isFilled ? fmtTime(value) : disabled ? '—' : 'En attente'}</div>
      </div>
      <div class="ts-actions">
        ${isFilled ? `
          <button class="ts-btn-icon" data-action="edit-ts" data-field="${field}">✏</button>
          <button class="ts-btn filled" data-action="edit-ts" data-field="${field}">${fmtTime(value)}</button>
        ` : `
          <button class="ts-btn" data-action="ts-now" data-field="${field}" ${disabled ? 'disabled' : ''}>Maintenant</button>
          <button class="ts-btn-icon" data-action="edit-ts" data-field="${field}" ${disabled ? 'disabled' : ''}>✏</button>
        `}
      </div>
    </div>
  `;
}

// ----------------------------------------------------------------------------
// EVENTS
// ----------------------------------------------------------------------------
function attachListeners() {
  $$('[data-action]').forEach(el => el.addEventListener('click', handleAction));
  $$('[data-bind]').forEach(el => {
    el.addEventListener('input', (e) => {
      if (tempDossier) tempDossier[e.target.dataset.bind] = e.target.value;
    });
  });
  $$('[data-bind-edit]').forEach(el => {
    el.addEventListener('input', (e) => {
      const d = state.dossiers.find(x => x.id === view.dossierId);
      if (!d) return;
      d[e.target.dataset.bindEdit] = e.target.value;
      // Autosave avec debounce
      if (autosaveTimer) clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(() => {
        saveDossier(d);
        toast('Sauvegardé', 'success');
      }, 800);
    });
  });
}

async function handleAction(e) {
  const t = e.currentTarget;
  const action = t.dataset.action;
  haptic('light');
  
  switch (action) {
    case 'nav':
      view.current = t.dataset.view;
      if (view.current === 'list') view.dossierId = null;
      render();
      break;
    case 'new':
      tempDossier = null;
      view.current = 'new';
      render();
      break;
    case 'cancel-new':
      tempDossier = null;
      view.current = 'list';
      render();
      break;
    case 'save-new':
      await saveNewDossier();
      break;
    case 'set-type':
      if (tempDossier) { tempDossier.type = t.dataset.type; render(); }
      break;
    case 'toggle-bureau':
      if (tempDossier) { tempDossier.bureau = !tempDossier.bureau; render(); }
      break;
    case 'set-depart':
      if (tempDossier) { tempDossier.pointDepart = t.dataset.depart; render(); }
      break;
    case 'detail':
      view.dossierId = t.dataset.id;
      view.current = 'detail';
      render();
      break;
    case 'filter':
      view.filter = t.dataset.filter;
      render();
      break;
    case 'prev-week':
      view.weekOffset--;
      render();
      break;
    case 'next-week':
      if (view.weekOffset < 0) { view.weekOffset++; render(); }
      break;
    case 'ts-now':
      await setTimestampNow(t.dataset.field);
      break;
    case 'edit-ts':
      await editTimestamp(t.dataset.field);
      break;
    case 'pick-date':
      await pickDate(t.dataset.field);
      break;
    case 'pick-time':
      await pickTime(t.dataset.field);
      break;
    case 'cloture':
      await showClotureModal();
      break;
    case 'cloture-tel':
      await clotureTel();
      break;
    case 'reopen':
      await reopenDossier();
      break;
    case 'delete':
      await deleteDossierAction();
      break;
    case 'edit-dossier':
      editDossier();
      break;
    case 'save-cr':
      const d = state.dossiers.find(x => x.id === view.dossierId);
      if (d) { await saveDossier(d); toast('Sauvegardé', 'success'); }
      break;
    case 'edit-setting':
      await editSetting(t.dataset.field);
      break;
    case 'toggle-statut':
      state.settings.statutSemaine = state.settings.statutSemaine === 'titulaire' ? 'suppleant' : 'titulaire';
      await saveSettings();
      render();
      break;
    case 'set-theme':
      state.settings.theme = t.dataset.theme;
      await saveSettings();
      applyTheme();
      render();
      break;
    case 'show-sync':
      showSyncModal();
      break;
    case 'sync-now':
      await doSync(true);
      break;
    case 'export-pdf':
      generatePDF();
      break;
    case 'export-email-nuit':
      generateEmailNuit();
      break;
    case 'export-email-custom':
      await generateEmailCustom();
      break;
    case 'export-data':
      exportData();
      break;
    case 'import-data':
      importData();
      break;
    case 'reset-data':
      await resetAllData();
      break;
    case 'show-sequence':
      // TODO: ouvrir vue séquence
      toast('Vue séquence à venir', 'warning');
      break;
    case 'calc-distance':
      await calculateDistance();
      break;
  }
}

async function saveNewDossier() {
  if (!tempDossier || !tempDossier.etablissement || !tempDossier.type) {
    toast('Établissement et type obligatoires', 'error');
    return;
  }
  
  tempDossier.dateAppel = roundTo5(tempDossier.dateAppel).toISOString();
  
  if (tempDossier.type === 'telephone') {
    tempDossier.statut = 'cloture';
  } else {
    tempDossier.statut = 'intervention';
    if (tempDossier.pointDepart === 'autre-site') {
      const openSeq = findOpenSequence();
      tempDossier.sequenceId = openSeq ? openSeq.sequenceId : uid();
    } else {
      tempDossier.sequenceId = uid();
    }
  }
  
  await saveDossier(tempDossier);
  haptic('success');
  toast(tempDossier.type === 'telephone' ? 'Appel enregistré' : 'Dossier créé', 'success');
  
  if (tempDossier.type === 'deplacement') {
    view.dossierId = tempDossier.id;
    view.current = 'detail';
  } else {
    view.current = 'list';
  }
  tempDossier = null;
  render();
}

async function setTimestampNow(field) {
  const d = state.dossiers.find(x => x.id === view.dossierId);
  if (!d) return;
  d[field] = roundTo5(new Date()).toISOString();
  recalcDurations(d);
  
  // Auto-clôture quand on saisit le retour domicile
  if (field === 'retourDomicile' && d.statut === 'intervention') {
    d.statut = 'cloture';
    await saveDossier(d);
    haptic('success');
    toast(`Clôturé • ${d.totalTrajetCalcule || '—'} payés`, 'success');
    render();
    return;
  }
  
  await saveDossier(d);
  haptic('medium');
  toast(`${field} : ${fmtTime(d[field])}`, 'success');
  render();
}

async function editTimestamp(field) {
  const d = state.dossiers.find(x => x.id === view.dossierId);
  if (!d) return;
  const current = d[field] ? new Date(d[field]) : new Date();
  const newDate = await showTimePicker(current, `${field}`);

  d[field] = roundTo5(newDate).toISOString();

  // Auto-clôture quand on saisit/modifie le retour domicile
  if (field === 'retourDomicile' && d.statut === 'intervention') {
    d.statut = 'cloture';
    await saveDossier(d);
    haptic('success');
    toast(`Clôturé • ${d.totalTrajetCalcule || '—'} payés`, 'success');
    render();
    return;
  }
  
  await saveDossier(d);
  render();
}

function showTimePicker(initialDate, title = 'Choisir l\'heure') {
  return new Promise((resolve) => {
    const rounded = roundTo5(initialDate);
    const initialValue = `${rounded.getHours().toString().padStart(2,'0')}:${rounded.getMinutes().toString().padStart(2,'0')}`;
    
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">${title}</div>
        <div class="modal-subtitle">Sélectionne l'heure avec les roulettes</div>
        
        <input type="time" id="native-time-picker" value="${initialValue}" step="300"
               style="width:100%;font-size:32px;text-align:center;padding:20px;background:var(--bg-subtle);
                      border:2px solid var(--accent);border-radius:var(--radius-lg);margin-bottom:16px;
                      color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:800;
                      font-variant-numeric:tabular-nums;letter-spacing:-0.02em;">
        
        <div class="time-quick-options">
          <button class="time-quick" data-tp="now">⏱ Maintenant</button>
          <button class="time-quick" data-tp="hour-back">↩ −1h</button>
          <button class="time-quick" data-tp="hour-forward">→ +1h</button>
        </div>
        
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn btn-secondary" style="flex:1" data-tp="cancel">Annuler</button>
          <button class="btn btn-primary" style="flex:1" data-tp="ok">Valider</button>
        </div>
      </div>
    `;
    
    const input = overlay.querySelector('#native-time-picker');
    
    overlay.querySelectorAll('[data-tp]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = e.currentTarget.dataset.tp;
        haptic('light');
        if (action === 'now') {
          const now = roundTo5(new Date());
          input.value = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        } else if (action === 'hour-back') {
          const [hh, mm] = input.value.split(':').map(Number);
          let newH = (hh - 1 + 24) % 24;
          input.value = `${newH.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}`;
        } else if (action === 'hour-forward') {
          const [hh, mm] = input.value.split(':').map(Number);
          let newH = (hh + 1) % 24;
          input.value = `${newH.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}`;
        } else if (action === 'cancel') {
          overlay.remove(); resolve(null);
        } else if (action === 'ok') {
          const [hh, mm] = input.value.split(':').map(Number);
          const result = new Date(initialDate);
          result.setHours(hh, mm, 0, 0);
          overlay.remove();
          resolve(roundTo5(result));
        }
      });
    });
    
    overlay.addEventListener('click', () => { overlay.remove(); resolve(null); });
    document.body.appendChild(overlay);
    
    setTimeout(() => input.focus(), 100);
  });
}

function showDatePicker(initialDate) {
  return new Promise((resolve) => {
    let currentMonth = new Date(initialDate.getFullYear(), initialDate.getMonth(), 1);
    let selectedDate = new Date(initialDate);
    
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    
    function renderPicker() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const monthName = currentMonth.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startDayOfWeek = (firstDay.getDay() + 6) % 7; // Lun = 0
      
      const cells = [];
      // Jours du mois précédent
      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const d = new Date(year, month, -i);
        cells.push({ date: d, otherMonth: true });
      }
      // Jours du mois
      for (let d = 1; d <= lastDay.getDate(); d++) {
        cells.push({ date: new Date(year, month, d), otherMonth: false });
      }
      // Jours du mois suivant (compléter)
      while (cells.length % 7 !== 0) {
        const lastCell = cells[cells.length - 1].date;
        const next = new Date(lastCell); next.setDate(next.getDate() + 1);
        cells.push({ date: next, otherMonth: true });
      }
      
      const today = new Date();
      
      overlay.innerHTML = `
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-handle"></div>
          <div class="modal-title">Choisir une date</div>
          
          <div class="date-nav">
            <button class="date-nav-btn" data-dp="prev">‹</button>
            <div class="date-nav-title">${monthName}</div>
            <button class="date-nav-btn" data-dp="next">›</button>
          </div>
          
          <div class="date-picker-grid">
            ${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d => `<div class="date-cell header">${d}</div>`).join('')}
            ${cells.map(c => {
              const isToday = c.date.toDateString() === today.toDateString();
              const isSelected = c.date.toDateString() === selectedDate.toDateString();
              return `<button class="date-cell ${c.otherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-dp="day" data-day="${c.date.toISOString()}">${c.date.getDate()}</button>`;
            }).join('')}
          </div>
          
          <div style="display:flex;gap:8px">
            <button class="btn btn-secondary" style="flex:1" data-dp="cancel">Annuler</button>
            <button class="btn btn-primary" style="flex:1" data-dp="ok">Valider</button>
          </div>
        </div>
      `;
      
      overlay.querySelectorAll('[data-dp]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const action = e.currentTarget.dataset.dp;
          haptic('light');
          switch (action) {
            case 'prev': currentMonth.setMonth(currentMonth.getMonth() - 1); renderPicker(); break;
            case 'next': currentMonth.setMonth(currentMonth.getMonth() + 1); renderPicker(); break;
            case 'day':
              selectedDate = new Date(e.currentTarget.dataset.day);
              renderPicker();
              break;
            case 'cancel':
              overlay.remove(); resolve(null); break;
            case 'ok':
              overlay.remove(); resolve(selectedDate); break;
          }
        });
      });
    }
    
    overlay.addEventListener('click', () => { overlay.remove(); resolve(null); });
    document.body.appendChild(overlay);
    renderPicker();
  });
}

function showConfirm(title, message, type = 'normal') {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">${escapeHtml(title)}</div>
        <div class="modal-subtitle">${escapeHtml(message)}</div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" style="flex:1" data-cf="no">Annuler</button>
          <button class="btn ${type === 'danger' ? 'btn-danger' : 'btn-primary'}" style="flex:1" data-cf="yes">Confirmer</button>
        </div>
      </div>
    `;
    overlay.querySelectorAll('[data-cf]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        overlay.remove();
        resolve(e.currentTarget.dataset.cf === 'yes');
      });
    });
    overlay.addEventListener('click', () => { overlay.remove(); resolve(false); });
    document.body.appendChild(overlay);
  });
}

function showPrompt(title, message, defaultValue = '', placeholder = '') {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">${escapeHtml(title)}</div>
        ${message ? `<div class="modal-subtitle">${escapeHtml(message)}</div>` : ''}
        <input type="text" class="form-input" id="prompt-input" value="${escapeHtml(defaultValue)}" placeholder="${escapeHtml(placeholder)}" autofocus style="margin-bottom:16px">
        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" style="flex:1" data-pr="no">Annuler</button>
          <button class="btn btn-primary" style="flex:1" data-pr="yes">Valider</button>
        </div>
      </div>
    `;
    const input = overlay.querySelector('#prompt-input');
    setTimeout(() => input.focus(), 100);
    
    overlay.querySelectorAll('[data-pr]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const yes = e.currentTarget.dataset.pr === 'yes';
        const val = input.value;
        overlay.remove();
        resolve(yes ? val : null);
      });
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = input.value;
        overlay.remove();
        resolve(val);
      }
    });
    overlay.addEventListener('click', () => { overlay.remove(); resolve(null); });
    document.body.appendChild(overlay);
  });
}

async function calculateDistance() {
  if (!tempDossier) return;
  
  const apiKey = state.settings.googleMapsApiKey;
  const origin = state.settings.adresseDomicile;
  const destination = tempDossier.adresseSite;
  
  if (!apiKey) { toast('Configure ta clé Google Maps API dans Réglages', 'error'); return; }
  if (!origin) { toast('Configure ton adresse domicile dans Réglages', 'error'); return; }
  if (!destination) { toast('Saisis d\'abord l\'adresse du site', 'error'); return; }
  
  toast('Calcul en cours...', 'warning');
  
  try {
    const url = `https://maps.googleapis.com/maps/api/distancematrix/json?` +
      `origins=${encodeURIComponent(origin)}&` +
      `destinations=${encodeURIComponent(destination)}&` +
      `units=metric&` +
      `key=${apiKey}`;
    
    const response = await fetch(url);
    const data = await response.json();
    
    if (data.status !== 'OK') {
      toast('Erreur API : ' + (data.error_message || data.status), 'error');
      return;
    }
    
    const element = data.rows[0]?.elements[0];
    if (!element || element.status !== 'OK') {
      toast('Itinéraire introuvable. Vérifie les adresses.', 'error');
      return;
    }
    
    const distanceMeters = element.distance.value;
    const distanceKm = (distanceMeters / 1000).toFixed(1);
    
    tempDossier.km = distanceKm;
    haptic('success');
    toast(`📍 ${distanceKm} km calculés (${element.distance.text})`, 'success');
    render();
  } catch (err) {
    console.error(err);
    toast('Erreur réseau. Vérifie ta connexion.', 'error');
  }
}

function generatePDF() {

    const week = getAstreinteWeek();
    const weekDossiers = getWeekDossiers(0).sort((a, b) => new Date(a.dateAppel) - new Date(b.dateAppel));
    
    if (weekDossiers.length === 0) {
      toast('Aucun dossier cette semaine', 'error');
      return;
    }
    
    // Header
    doc.setFontSize(14);
    doc.setFont('helvetica', 'bold');
    doc.rect(10, 8, 280, 14);
    doc.rect(10, 8, 40, 14);
    doc.text('AMI2S', 30, 17, { align: 'center' });

    doc.text('G1-0-8 - Version D', 170, 13, { align: 'center' });
    doc.setLineWidth(0.1);
    doc.line(50, 15, 290, 15);
    doc.setFontSize(10);

    else doc.text('X', 245.7, 27.5);

    doc.text('Suppléant', 250, 28);
    
    doc.text(`Semaine n° ${week.weekNumber} — du ${fmtDate(week.start)} au ${fmtDate(week.end)}`, 10, 33);
    
    // Table
    const headers = [
      [
        { content: 'N°', rowSpan: 2 },
        { content: 'Date', rowSpan: 2 },
        { content: 'Informations client', colSpan: 3, styles: { fillColor: [176, 176, 176] } },
        { content: 'Dépannage', colSpan: 2, styles: { fillColor: [176, 176, 176] } },
        { content: 'Intervention sur site', colSpan: 5, styles: { fillColor: [176, 176, 176] } },
        { content: 'Notification temps de trajets', colSpan: 3, styles: { fillColor: [176, 176, 176] } }
      ],
      ['N° Abonné', 'Demandeur', 'H. appel', 'Tél.', 'Site', 'Rapport N°', 'Arr. site', 'Départ site', 'Tps site', 'Km', 'Départ dom.', 'Retour dom.', 'Total trajet']
    ];
    
    const rows = [];
    let totalTrajetMs = 0;
    let totalKm = 0;
    
    // Identifier les séquences
    const seqGroups = {};
    weekDossiers.forEach(d => {
      if (d.sequenceId) {
        if (!seqGroups[d.sequenceId]) seqGroups[d.sequenceId] = [];
        seqGroups[d.sequenceId].push(d);
      }
    });
    
    weekDossiers.forEach((d, idx) => {
      const isPhone = d.type === 'telephone';
      const isBureau = d.bureau;
      let departDom = d.departDomicile ? fmtTime(d.departDomicile) : '—';
      let retourDom = d.retourDomicile ? fmtTime(d.retourDomicile) : '—';
      let totalTrajet = '—';
      
      if (d.sequenceId && seqGroups[d.sequenceId] && seqGroups[d.sequenceId].length > 1) {
        const seq = seqGroups[d.sequenceId].sort((a,b) => new Date(a.dateAppel) - new Date(b.dateAppel));
        const isFirst = seq[0].id === d.id;
        const isLast = seq[seq.length - 1].id === d.id;
        
        if (!isFirst) departDom = 'X';
        if (!isLast) { retourDom = 'X'; totalTrajet = 'X'; }
        else if (d.departDomicile && d.retourDomicile) {
          const seqFirst = seq[0];
          const ms = diffMs(seqFirst.departDomicile, d.retourDomicile);
          totalTrajet = fmtDuration(ms);
          totalTrajetMs += ms;
        }
      } else if (d.departDomicile && d.retourDomicile) {
        const ms = diffMs(d.departDomicile, d.retourDomicile);
        totalTrajet = fmtDuration(ms);
        totalTrajetMs += ms;
      }
      
      if (d.km) totalKm += parseFloat(d.km) || 0;
      
      rows.push([
        idx + 1,
        fmtDateShort(d.dateAppel),
        d.codeAstreinte || '',
        d.etablissement || '',
        isBureau ? 'BUREAU' : fmtTime(d.dateAppel),
        isPhone ? 'X' : '',
        !isPhone ? 'X' : '',
        d.rapportN || (isPhone ? '—' : ''),
        d.arriveeSite ? fmtTime(d.arriveeSite) : (isPhone ? '—' : ''),
        d.departSite ? fmtTime(d.departSite) : (isPhone ? '—' : ''),
        d.tempsSiteCalcule || (isPhone ? '—' : ''),
        d.km || (isPhone ? '—' : ''),
        departDom, retourDom, totalTrajet
      ]);
    });
    
    while (rows.length < 18) {
      rows.push([rows.length + 1, '', '', '', '', '', '', '', '', '', '', '', '', '', '']);
    }
    
    rows.push([
      { content: 'TOTAL HEBDOMADAIRE', colSpan: 11, styles: { fillColor: [136,136,136], textColor: [255,255,255], fontStyle: 'bold', halign: 'right' } },
      { content: `${totalKm.toFixed(0)} km`, colSpan: 3, styles: { fillColor: [136,136,136], textColor: [255,255,255], fontStyle: 'bold', halign: 'center' } },
      { content: fmtDuration(totalTrajetMs), styles: { fillColor: [136,136,136], textColor: [255,255,255], fontStyle: 'bold', halign: 'center' } }
    ]);
    
    doc.autoTable({
      head: headers, body: rows, startY: 36, theme: 'grid',
      styles: { fontSize: 6.5, cellPadding: 1, valign: 'middle', halign: 'center' },
      headStyles: { fillColor: [208,208,208], textColor: [0,0,0], fontSize: 6.5, fontStyle: 'bold' },
      columnStyles: {
        0: { cellWidth: 6 }, 1: { cellWidth: 14 }, 2: { cellWidth: 20 },
        3: { cellWidth: 22 }, 4: { cellWidth: 13 }, 5: { cellWidth: 8 },
        6: { cellWidth: 8 }, 7: { cellWidth: 20 }, 8: { cellWidth: 13 },
        9: { cellWidth: 13 }, 10: { cellWidth: 13 }, 11: { cellWidth: 10 },
        12: { cellWidth: 16 }, 13: { cellWidth: 16 }, 14: { cellWidth: 18 }
      },
      margin: { left: 10, right: 10 }
    });
    
    const finalY = doc.lastAutoTable.finalY + 4;
    doc.setFontSize(6);
    doc.setFont('helvetica', 'italic');
    doc.text('* Mention obligatoire — En cas d\'impossibilité d\'intervention du titulaire, celui-ci doit appeler son suppléant dans l\'heure qui suit l\'appel du client !!!', 10, finalY);
    
    const valY = finalY + 3;
    const valW = 67;
    const valH = 26;
    for (let i = 0; i < 4; i++) doc.rect(10 + i * (valW + 3), valY, valW, valH);
    
    doc.setFontSize(6.5);
    doc.setFont('helvetica', 'bold');
    doc.text('Étape n°1\nValidation du Salarié', 10 + valW/2, valY + 4, { align: 'center' });
    doc.text('Étape n°2\nContrôle Agent Administratif', 10 + valW + 3 + valW/2, valY + 4, { align: 'center' });
    doc.text('Étape n°3\nValidation Responsable Service', 10 + 2*(valW + 3) + valW/2, valY + 4, { align: 'center' });
    doc.text('Étape n°4\nRéception Service RH', 10 + 3*(valW + 3) + valW/2, valY + 4, { align: 'center' });
    
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(6);
    for (let i = 0; i < 4; i++) {
      doc.text('Date :', 12 + i * (valW + 3), valY + 18);
      if (i < 3) doc.text('Signature :', 12 + i * (valW + 3), valY + 23);
    }
    
    const filename = `G1-0-8_S${week.weekNumber}_${(state.settings.technicien || 'tech').replace(/\s+/g, '_')}.pdf`;
    doc.save(filename);
    haptic('success');
    toast(`PDF généré : ${filename}`, 'success');
  } catch (err) {
    console.error(err);
    toast('Erreur génération PDF', 'error');
  }
}

// ----------------------------------------------------------------------------
// EMAIL EXPORT
// ----------------------------------------------------------------------------
function generateEmailNuit() {
  const now = new Date();
  const today8h = new Date(now); today8h.setHours(8, 0, 0, 0);
  const yesterday18h = new Date(today8h); yesterday18h.setDate(yesterday18h.getDate() - 1); yesterday18h.setHours(18, 0, 0, 0);
  
  const dossiers = state.dossiers.filter(d => {
    const dt = new Date(d.dateAppel);
    return dt >= yesterday18h && dt <= today8h;
  }).sort((a, b) => new Date(a.dateAppel) - new Date(b.dateAppel));
  
  buildEmail(dossiers, `CR Astreinte — Nuit du ${fmtDate(yesterday18h)} au ${fmtDate(today8h)}`);
}

async function generateEmailCustom() {
  const start = await showPrompt('Date de début', 'Format JJ/MM/AAAA', fmtDate(new Date()));
  if (!start) return;
  const end = await showPrompt('Date de fin', 'Format JJ/MM/AAAA', fmtDate(new Date()));
  if (!end) return;
  
  try {
    const [d1, m1, y1] = start.split('/');
    const [d2, m2, y2] = end.split('/');
    const startDate = new Date(y1, m1-1, d1, 0, 0);
    const endDate = new Date(y2, m2-1, d2, 23, 59);
    
    const dossiers = state.dossiers.filter(d => {
      const dt = new Date(d.dateAppel);
      return dt >= startDate && dt <= endDate;
    }).sort((a, b) => new Date(a.dateAppel) - new Date(b.dateAppel));
    
    buildEmail(dossiers, `CR Astreinte — Du ${fmtDate(startDate)} au ${fmtDate(endDate)}`);
  } catch (e) {
    toast('Format de date invalide', 'error');
  }
}

function buildEmail(dossiers, subject) {
  if (dossiers.length === 0) { toast('Aucun dossier sur cette période', 'error'); return; }
  
  const techName = state.settings.technicien || 'Le technicien d\'astreinte';
  
  let body = `Bonjour,\n\n`;
  body += `Voici le compte-rendu des interventions de l'astreinte.\n\n`;
  body += `──────────────────────────────────────────\n\n`;
  
  dossiers.forEach((d, i) => {
    body += `▸ Dossier n°${i + 1}\n`;
    body += `   Établissement : ${d.etablissement}\n`;
    if (d.codeAstreinte) body += `   Code astreinte : ${d.codeAstreinte}\n`;
    body += `   Date : ${fmtDate(d.dateAppel)}${d.bureau ? ' (transmis par le bureau)' : ''}\n`;
    if (d.motif) body += `   Motif : ${d.motif}\n`;
    
    if (d.type === 'telephone') {
      body += `   Traitement : ✓ Résolu par téléphone\n`;
    } else {
      body += `   Traitement : ✓ Intervention sur site\n`;
      if (d.rapportN) body += `   N° rapport : ${d.rapportN}\n`;
      if (d.compteRendu) {
        body += `\n   COMPTE-RENDU :\n`;
        const lines = d.compteRendu.split('\n');
        lines.forEach(line => body += `   ${line}\n`);
      }
    }
    body += `\n`;
  });
  
  body += `──────────────────────────────────────────\n\n`;
  body += `Récapitulatif :\n`;
  body += `   • ${dossiers.length} dossier(s) traité(s)\n`;
  body += `   • ${dossiers.filter(d => d.type === 'deplacement').length} intervention(s) sur site\n`;
  body += `   • ${dossiers.filter(d => d.type === 'telephone').length} résolution(s) téléphonique(s)\n\n`;
  
  body += `Cordialement,\n${techName}\n`;
  body += `Service Maintenance — AMI2S`;
  
  const mailto = `mailto:${state.settings.emailDestinataire}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  navigator.clipboard.writeText(body).then(() => toast('Texte copié + Outlook ouvert', 'success'))
    .catch(() => toast('Outlook ouvert', 'success'));
  window.location.href = mailto;
}

// ----------------------------------------------------------------------------
// DATA IMPORT/EXPORT
// ----------------------------------------------------------------------------
function exportData() {
  const data = JSON.stringify({ settings: state.settings, dossiers: state.dossiers, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `astreintes_backup_${new Date().toISOString().substring(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Sauvegarde téléchargée', 'success');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        const confirmed = await showConfirm('Restaurer ?', `${data.dossiers?.length || 0} dossiers à importer. Les données actuelles seront remplacées.`, 'danger');
        if (!confirmed) return;
        
        await dbClear('dossiers');
        if (data.settings) {
          state.settings = { ...DEFAULT_SETTINGS, ...data.settings };
          await saveSettings();
        }
        state.dossiers = [];
        if (data.dossiers) {
          for (const d of data.dossiers) {
            await dbPut('dossiers', d);
            state.dossiers.push(d);
          }
        }
        toast('Données restaurées', 'success');
        applyTheme();
        render();
      } catch (err) {
        toast('Fichier invalide', 'error');
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

async function resetAllData() {
  const c1 = await showConfirm('Tout effacer ?', 'Tous les dossiers et réglages seront supprimés.', 'danger');
  if (!c1) return;
  const c2 = await showConfirm('Vraiment sûr ?', 'Cette action est définitive.', 'danger');
  if (!c2) return;
  
  await dbClear('dossiers');
  await dbClear('settings');
  state = { settings: { ...DEFAULT_SETTINGS }, dossiers: [] };
  view = { current: 'list', filter: 'all', dossierId: null, weekOffset: 0 };
  applyTheme();
  render();
  toast('Données effacées', 'success');
}

// ----------------------------------------------------------------------------
// TOAST
// ----------------------------------------------------------------------------
function toast(message, type = 'info') {
  const container = $('#toasts');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = (type === 'success' ? '✓ ' : type === 'error' ? '✕ ' : '') + escapeHtml(message);
  container.appendChild(el);
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transition = 'opacity 0.3s';
    setTimeout(() => el.remove(), 300);
  }, 2500);
}

// ----------------------------------------------------------------------------
// INIT
// ----------------------------------------------------------------------------
async function init() {
  try {
    await loadState();
    render();
    
    // Service worker pour PWA
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', e => self.skipWaiting());
        self.addEventListener('activate', e => self.clients.claim());
      `;
      const swBlob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
    }
    
    // Notification de rappel
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
    
    // Sync au démarrage si configuré
    if (state.settings.syncEnabled && state.settings.syncUrl) {
      setTimeout(() => doSync(), 2000);
    }
  } catch (err) {
    console.error('Init error', err);
    document.body.innerHTML = '<div style="padding:40px;text-align:center;color:#ef4444">Erreur d\'initialisation : ' + err.message + '</div>';
  }
}

init();
