function renderSequence() {
  const openSeq = findOpenSequence();
  
  if (!openSeq || openSeq.dossiers.length === 0) {
    return `
      <header class="app-header">
        <div class="header-top">
          <div style="display:flex;align-items:center;gap:10px">
            <button class="icon-btn" data-action="back-list">←</button>
            <div>
              <div class="header-title">Séquence</div>
              <div class="header-subtitle">Aucune séquence ouverte</div>
            </div>
          </div>
        </div>
      </header>
      <main class="main-content">
        <div class="empty-state" style="padding:60px 20px">
          <div class="empty-state-icon">✅</div>
          <div class="empty-state-title">Pas de séquence ouverte</div>
          <div class="empty-state-desc">Toutes tes interventions sont clôturées avec retour domicile.</div>
        </div>
      </main>
      ${renderBottomNav()}
    `;
  }
  
  // V2.9.7 — Tri intelligent qui gère les dossiers pas encore visités
  // Si un dossier n'a pas d'arrivée site, on le met EN DERNIER (parce que tu n'y es pas encore allé)
  function getInterventionTime(d) {
    if (d.arriveeSite) return new Date(d.arriveeSite);
    if (d.departDomicile && d.departDomicile !== 'X') return new Date(d.departDomicile);
    // Pas encore arrivé : on met en dernier (futur lointain)
    return new Date(9999, 11, 31);
  }
  const dossiers = [...openSeq.dossiers].sort((a, b) => getInterventionTime(a) - getInterventionTime(b));
  
  // Calculs récap
  let totalKm = 0;
  let totalTimeSiteMs = 0;
  let totalTimeTrajetMs = 0;
  
  // Premier départ domicile (le vrai, pas X)
  const firstDepart = dossiers.find(d => d.departDomicile && d.departDomicile !== 'X');
  // Dernier retour domicile (s'il existe et n'est pas X)
  const lastRetour = [...dossiers].reverse().find(d => d.retourDomicile && d.retourDomicile !== 'X');
  
  if (firstDepart && lastRetour) {
    totalTimeTrajetMs = diffMs(firstDepart.departDomicile, lastRetour.retourDomicile);
  } else if (firstDepart) {
    // Séquence en cours : estime depuis le départ jusqu'à maintenant
    totalTimeTrajetMs = diffMs(firstDepart.departDomicile, new Date());
  }
  
  dossiers.forEach(d => {
    if (d.km) totalKm += parseFloat(d.km) || 0;
    if (d.tempsSiteMs) totalTimeSiteMs += d.tempsSiteMs;
  });
  
  return `
    <header class="app-header">
      <div class="header-top">
        <div style="display:flex;align-items:center;gap:10px">
          <button class="icon-btn" data-action="back-list">←</button>
          <div>
            <div class="header-title">Séquence ouverte</div>
            <div class="header-subtitle">${dossiers.length} dossier(s) enchaîné(s)</div>
          </div>
        </div>
      </div>
    </header>
    
    <main class="main-content">
      <!-- Récap global -->
      <div class="section" style="margin-top:16px">
        <div class="section-title">📊 Récapitulatif</div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px">
          <div class="stat-card">
            <div class="stat-value">${dossiers.length}</div>
            <div class="stat-label">Dossiers</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${totalKm.toFixed(1)}</div>
            <div class="stat-label">Km parcourus</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${fmtDuration(totalTimeSiteMs)}</div>
            <div class="stat-label">Sur site (total)</div>
          </div>
          <div class="stat-card accent">
            <div class="stat-value">${totalTimeTrajetMs ? fmtDuration(totalTimeTrajetMs) : '—'}</div>
            <div class="stat-label">${lastRetour ? 'Total payé' : 'Estimé (en cours)'}</div>
          </div>
        </div>
        ${firstDepart ? `
          <div style="margin-top:12px;padding:12px;background:var(--bg-subtle);border-radius:var(--radius);font-size:13px;color:var(--text-secondary)">
            <div>🏠 <b>Départ :</b> ${fmtDate(firstDepart.departDomicile)} à ${fmtTime(firstDepart.departDomicile)}</div>
            ${lastRetour ? `
              <div style="margin-top:4px">🏠 <b>Retour :</b> ${fmtDate(lastRetour.retourDomicile)} à ${fmtTime(lastRetour.retourDomicile)}</div>
            ` : `
              <div style="margin-top:4px;color:var(--status-chain)">🔗 <b>Pas encore rentré</b> (séquence en cours)</div>
            `}
          </div>
        ` : ''}
      </div>
      
      <!-- Timeline des dossiers -->
      <div class="section">
        <div class="section-title">🔗 Timeline d'enchaînement</div>
        <div class="sequence-timeline">
          ${dossiers.map((d, idx) => {
            const isLast = idx === dossiers.length - 1;
            const next = dossiers[idx + 1];
            const isChainOut = d.retourDomicile === 'X' && !isLast;
            
            return `
              <div class="seq-step">
                <div class="seq-step-dot" style="background:${d.statut === 'cloture' ? 'var(--status-success)' : 'var(--status-warning)'}"></div>
                <div class="seq-step-content" data-action="detail" data-id="${d.id}">
                  <div style="display:flex;justify-content:space-between;align-items:start;gap:8px;margin-bottom:6px">
                    <div style="font-weight:600;font-size:15px">${escapeHtml(d.etablissement)}</div>
                    <div style="font-size:11px;color:var(--text-secondary);font-family:'JetBrains Mono',monospace;white-space:nowrap">${fmtDateShort(d.dateAppel)} ${fmtTime(d.dateAppel)}</div>
                  </div>
                  ${d.adresseSite ? `<div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px">📍 ${escapeHtml(d.adresseSite)}</div>` : ''}
                  <div style="display:flex;gap:12px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap">
                    ${d.departDomicile === 'X' ? '<span style="color:var(--status-chain)">🔗 Chaînage entrant</span>' : 
                      d.departDomicile ? '<span>🏠→ ' + fmtTime(d.departDomicile) + '</span>' : ''}
                    ${d.tempsSiteCalcule ? '<span>⏱ ' + d.tempsSiteCalcule + '</span>' : ''}
                    ${d.km ? '<span>📏 ' + d.km + ' km</span>' : ''}
                    ${d.retourDomicile === 'X' ? '<span style="color:var(--status-chain)">→🔗 Chaînage sortant</span>' :
                      d.retourDomicile ? '<span>→🏠 ' + fmtTime(d.retourDomicile) + '</span>' : ''}
                  </div>
                </div>
                ${isChainOut ? `<div class="seq-chain-arrow">↓ chaînage vers le site suivant</div>` : ''}
              </div>
            `;
          }).join('')}
        </div>
      </div>
      
      <div style="padding:20px;text-align:center;color:var(--text-secondary);font-size:12px">
        💡 Clique sur un dossier pour le modifier
      </div>
    </main>
    
    ${renderBottomNav()}
  `;
}

function attachListeners() {
  $$('[data-action]').forEach(el => el.addEventListener('click', handleAction));
  $$('[data-bind]').forEach(el => {
    el.addEventListener('input', (e) => {
      if (tempDossier) tempDossier[e.target.dataset.bind] = e.target.value;
    });
  });
  $$('[data-bind-edit]').forEach(el => {
    // V2.9.9 — Liste blanche des champs autorisés en édition inline
    // Les champs sensibles (horaires, sequenceId, type, statut) ne sont JAMAIS éditables via data-bind-edit
    const ALLOWED_EDIT_FIELDS = [
      'etablissement', 'codeAstreinte', 'motif', 'rapportN', 
      'adresseSite', 'km', 'compteRendu'
    ];
    
    // Mémoriser la valeur initiale pour détecter un vrai changement
    el.dataset.initialValue = el.value;
    
    el.addEventListener('input', (e) => {
      const field = e.target.dataset.bindEdit;
      
      // Vérification sécurité : seuls les champs autorisés peuvent être édités
      if (!ALLOWED_EDIT_FIELDS.includes(field)) {
        console.warn(`Champ "${field}" non autorisé en édition inline`);
        return;
      }
      
      const d = state.dossiers.find(x => x.id === view.dossierId);
      if (!d) return;
      
      // Pas de sauvegarde si la valeur n'a pas vraiment changé
      const newValue = e.target.value;
      if (newValue === el.dataset.initialValue) return;
      
      d[field] = newValue;
      // Mettre à jour la valeur initiale après modification
      el.dataset.initialValue = newValue;
      
      if (autosaveTimer) clearTimeout(autosaveTimer);
      autosaveTimer = setTimeout(() => {
        // Nettoyer le flag _isEdit qui peut traîner
        delete d._isEdit;
        saveDossier(d);
        toast('Sauvegardé', 'success');
      }, 800);
    });
  });
  
  // Barre de recherche
  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      view.searchQuery = e.target.value;
      // Re-render seulement la liste pour pas perdre le focus
      const listEl = document.querySelector('.dossiers-list');
      if (listEl) {
        const filtered = getFilteredDossiers();
        listEl.innerHTML = filtered.length === 0 ? `
          <div class="empty-state">
            <div class="empty-state-icon">🔍</div>
            <div class="empty-state-title">Aucun résultat</div>
            <div class="empty-state-desc">Aucun dossier ne correspond à "${escapeHtml(view.searchQuery)}"</div>
          </div>
        ` : filtered.map(renderDossierCard).join('');
        // Re-attach detail handlers
        listEl.querySelectorAll('[data-action="detail"]').forEach(el => el.addEventListener('click', handleAction));
      }
    });
  }
}

async function handleAction(e) {
  const t = e.currentTarget;
  const action = t.dataset.action;
  haptic('light');
  
  switch (action) {
    case 'nav':
      view.current = t.dataset.view;
      if (view.current === 'list') view.dossierId = null;
      render();
      break;
    case 'new':
      tempDossier = null;
      view.current = 'new';
      render();
      break;
    case 'quick-new':
      await quickNew();
      break;
    case 'cancel-new':
      tempDossier = null;
      view.current = 'list';
      render();
      break;
    case 'back-list':
      view.current = 'list';
      render();
      break;
    case 'save-new':
      await saveNewDossier();
      break;
    case 'set-type':
      if (tempDossier) { tempDossier.type = t.dataset.type; render(); }
      break;
    case 'toggle-bureau':
      if (tempDossier) { tempDossier.bureau = !tempDossier.bureau; render(); }
      break;
    case 'set-depart':
      if (tempDossier) { tempDossier.pointDepart = t.dataset.depart; render(); }
      break;
    case 'detail':
      view.dossierId = t.dataset.id;
      view.current = 'detail';
      render();
      break;
    case 'filter':
      view.filter = t.dataset.filter;
      render();
      break;
    case 'clear-search':
      view.searchQuery = '';
      render();
      break;
    case 'prev-week':
      view.weekOffset--;
      render();
      break;
    case 'next-week':
      if (view.weekOffset < 0) { view.weekOffset++; render(); }
      break;
    // V2.9.9 — Navigation semaines Stats
    case 'stats-prev-week':
      view.statsWeekOffset = (view.statsWeekOffset || 0) - 1;
      render();
      break;
    case 'stats-next-week':
      if ((view.statsWeekOffset || 0) < 0) {
        view.statsWeekOffset = (view.statsWeekOffset || 0) + 1;
        render();
      }
      break;
    case 'stats-current-week':
      view.statsWeekOffset = 0;
      render();
      break;
    // V2.9.9 — Navigation semaines Export
    case 'export-prev-week':
      view.exportWeekOffset = (view.exportWeekOffset === null ? 0 : view.exportWeekOffset) - 1;
      render();
      break;
    case 'export-next-week':
      if ((view.exportWeekOffset || 0) < 0) {
        view.exportWeekOffset = (view.exportWeekOffset || 0) + 1;
        render();
      }
      break;
    case 'export-current-week':
      view.exportWeekOffset = 0;
      render();
      break;
    case 'export-period-custom':
      await editRapportPeriodeCustom();
      break;
    case 'ts-now':
      await setTimestampNow(t.dataset.field);
      break;
    case 'ts-cross':
      await setTimestampCross(t.dataset.field);
      break;
    case 'clear-ts':
      await clearTimestamp(t.dataset.field);
      break;
    case 'edit-ts':
      await editTimestamp(t.dataset.field);
      break;
    case 'pick-date':
      await pickDate(t.dataset.field);
      break;
    case 'pick-time':
      await pickTime(t.dataset.field);
      break;
    case 'cloture':
      await showClotureModal();
      break;
    case 'cloture-tel':
      await clotureTel();
      break;
    case 'reopen':
      await reopenDossier();
      break;
    case 'delete':
      await deleteDossierAction();
      break;
    case 'edit-dossier':
      editDossier();
      break;
    case 'save-cr':
      const d = state.dossiers.find(x => x.id === view.dossierId);
      if (d) { await saveDossier(d); toast('Sauvegardé', 'success'); }
      break;
    case 'edit-setting':
      await editSetting(t.dataset.field);
      break;
    case 'toggle-statut':
      state.settings.statutSemaine = state.settings.statutSemaine === 'titulaire' ? 'suppleant' : 'titulaire';
      await saveSettings();
      render();
      break;
    case 'toggle-alertes':
      state.settings.alertesActives = !state.settings.alertesActives;
      if (state.settings.alertesActives && 'Notification' in window && Notification.permission === 'default') {
        await Notification.requestPermission();
      }
      await saveSettings();
      render();
      break;
    case 'set-theme':
      state.settings.theme = t.dataset.theme;
      await saveSettings();
      applyTheme();
      render();
      break;
    case 'show-sync':
      showSyncModal();
      break;
    case 'sync-now':
      await doFullSync(true);
      break;
    case 'export-pdf':
      generatePDF();
      break;
    case 'export-email-nuit':
      generateEmailNuit();
      break;
    case 'export-email-custom':
      await generateEmailCustom();
      break;
    case 'export-data':
      exportData();
      break;
    case 'import-data':
      importData();
      break;
    case 'reset-data':
      await resetAllData();
      break;
    case 'show-sequence':
      view.current = 'sequence';
      render();
      break;
    case 'calc-distance':
      await calculateDistance();
      break;
    case 'edit-adresse-site':
      await editAdresseSite();
      break;
  }
}

async function saveNewDossier() {
  if (!tempDossier || !tempDossier.etablissement || !tempDossier.type) {
    toast('Établissement et type obligatoires', 'error');
    return;
  }
  
  if (tempDossier.type === 'telephone') {
    tempDossier.statut = 'cloture';
  } else {
    tempDossier.statut = 'intervention';
    if (tempDossier.pointDepart === 'autre-site') {
      const openSeq = findOpenSequence();
      // Si une séquence est ouverte, on rejoint cette séquence
      // Sinon on crée une nouvelle séquence ET on marque automatiquement le départ domicile à X
      if (openSeq) {
        tempDossier.sequenceId = openSeq.sequenceId;
      } else {
        tempDossier.sequenceId = uid();
      }
      // Auto-marquer le départ domicile à X (chaînage entrant)
      tempDossier.departDomicile = 'X';
    } else {
      tempDossier.sequenceId = uid();
    }
  }
  
  // Ajouter aux favoris (pour auto-complétion future)
  if (tempDossier.etablissement && !state.settings.favorisEtablissements.includes(tempDossier.etablissement)) {
    state.settings.favorisEtablissements = state.settings.favorisEtablissements || [];
    state.settings.favorisEtablissements.unshift(tempDossier.etablissement);
    if (state.settings.favorisEtablissements.length > 20) {
      state.settings.favorisEtablissements = state.settings.favorisEtablissements.slice(0, 20);
    }
    await saveSettings();
  }
  
  // V2.9.9 — Nettoyer le flag _isEdit (résidu d'édition)
  delete tempDossier._isEdit;
  
  await saveDossier(tempDossier);
  haptic('success');
  toast(tempDossier.type === 'telephone' ? 'Appel enregistré' : 'Dossier créé', 'success');
  
  if (tempDossier.type === 'deplacement') {
    view.dossierId = tempDossier.id;
    view.current = 'detail';
  } else {
    view.current = 'list';
  }
  tempDossier = null;
  render();
}

async function setTimestampNow(field) {
  const d = state.dossiers.find(x => x.id === view.dossierId);
  if (!d) return;
  
  // V2.9.3 — Bug fix : pour les dossiers passés (saisie rétroactive)
  // on prend la date d'appel du dossier au lieu de "aujourd'hui"
  const now = new Date();
  const dossierDate = d.dateAppel ? new Date(d.dateAppel) : null;
  let timestamp;
  
  if (dossierDate) {
    // Détecter si on est sur un dossier de plus d'1h dans le passé
    // → on suppose saisie rétroactive → on garde la date du dossier
    const dossierToday = new Date(dossierDate.getFullYear(), dossierDate.getMonth(), dossierDate.getDate());
    const realToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    
    if (dossierToday.getTime() !== realToday.getTime()) {
      // Saisie rétroactive : utiliser la date du dossier + heure actuelle
      timestamp = new Date(dossierDate);
      timestamp.setHours(now.getHours(), now.getMinutes(), 0, 0);
      
      // Si le retourDomicile est plus tôt que le départ → passage minuit → +1 jour
      if (field === 'retourDomicile' && d.departDomicile && d.departDomicile !== 'X') {
        const departDate = new Date(d.departDomicile);
        if (timestamp < departDate) {
          timestamp.setDate(timestamp.getDate() + 1);
        }
      } else if (field === 'arriveeSite' && d.departDomicile && d.departDomicile !== 'X') {
        const departDate = new Date(d.departDomicile);
        if (timestamp < departDate) {
          timestamp.setDate(timestamp.getDate() + 1);
        }
      } else if (field === 'departSite' && d.arriveeSite) {
        const arriveeDate = new Date(d.arriveeSite);
        if (timestamp < arriveeDate) {
          timestamp.setDate(timestamp.getDate() + 1);
        }
      } else if (field === 'retourDomicile' && d.departSite) {
        const departSiteDate = new Date(d.departSite);
        if (timestamp < departSiteDate) {
          timestamp.setDate(timestamp.getDate() + 1);
        }
      }
    } else {
      // Saisie temps réel : utiliser maintenant
      timestamp = now;
    }
  } else {
    timestamp = now;
  }
  
  d[field] = roundTo5(timestamp).toISOString();
  recalcDurations(d);
  
  if (field === 'retourDomicile' && d.statut === 'intervention') {
    d.statut = 'cloture';
    await saveDossier(d);
    haptic('success');
    toast(`Clôturé • ${d.totalTrajetCalcule || '—'} payés`, 'success');
    render();
    return;
  }
  
  await saveDossier(d);
  haptic('medium');
  toast(`${field} : ${fmtTime(d[field])}`, 'success');
  render();
}

async function setTimestampCross(field) {

async function editTimestamp(field) {
  const d = state.dossiers.find(x => x.id === view.dossierId);
  if (!d) return;
  const current = d[field] ? new Date(d[field]) : new Date();
  const newDate = await showTimePicker(current, `${field}`);
  if (!newDate) return;
  let finalDate = roundTo5(newDate);
  
  // V2.9 — Protection passage minuit
  // Si on modifie un timestamp qui doit être APRÈS un autre, on vérifie
  const checkAfterField = {
    'arriveeSite': 'departDomicile',
    'departSite': 'arriveeSite',
    'retourDomicile': 'departSite'
  };
  
  const previousField = checkAfterField[field];
  if (previousField && d[previousField] && d[previousField] !== 'X') {
    const previousDate = new Date(d[previousField]);
    if (finalDate < previousDate) {
      // L'heure saisie est AVANT le timestamp précédent → bascule probable au jour suivant
      const nextDayDate = new Date(finalDate);
      nextDayDate.setDate(nextDayDate.getDate() + 1);
      
      const confirmed = await showConfirm(
        '🌙 Passage minuit ?',
        `L'heure saisie (${fmtTime(finalDate)}) est avant ${fmtTime(previousDate)} (${labelField(previousField)}). ` +
        `Tu veux dire le lendemain à ${fmtTime(finalDate)} ? Total estimé : ${fmtDuration(diffMs(previousDate, nextDayDate))}.`
      );
      
      if (confirmed) {
        finalDate = nextDayDate;
      }
    }
  }
  
  d[field] = finalDate.toISOString();
  recalcDurations(d);
  
  // Auto-clôture quand on saisit/modifie le retour domicile
  if (field === 'retourDomicile' && d.statut === 'intervention') {
    d.statut = 'cloture';
    await saveDossier(d);
    haptic('success');
    toast(`Clôturé • ${d.totalTrajetCalcule || '—'} payés`, 'success');
    render();
    return;
  }
  
  await saveDossier(d);
  render();
}

function showTimePicker(initialDate, title = 'Choisir l\'heure', noRound = false) {
  return new Promise((resolve) => {
    const baseDate = noRound ? new Date(initialDate) : roundTo5(initialDate);
    const initialValue = `${baseDate.getHours().toString().padStart(2,'0')}:${baseDate.getMinutes().toString().padStart(2,'0')}`;
    const stepValue = noRound ? '60' : '300'; // 1 min ou 5 min
    
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">${title}</div>
        <div class="modal-subtitle">${noRound ? 'Sélectionne l\'heure exacte' : 'Arrondie au 5 minutes le plus proche'}</div>
        
        <input type="time" id="native-time-picker" value="${initialValue}" step="${stepValue}"
               style="width:100%;font-size:32px;text-align:center;padding:20px;background:var(--bg-subtle);
                      border:2px solid var(--accent);border-radius:var(--radius-lg);margin-bottom:16px;
                      color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:800;
                      font-variant-numeric:tabular-nums;letter-spacing:-0.02em;">
        
        <div class="time-quick-options">
          <button class="time-quick" data-tp="now">⏱ Maintenant</button>
          <button class="time-quick" data-tp="hour-back">↩ −1h</button>
          <button class="time-quick" data-tp="hour-forward">→ +1h</button>
        </div>
        
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn btn-secondary" style="flex:1" data-tp="cancel">Annuler</button>
          <button class="btn btn-primary" style="flex:1" data-tp="ok">Valider</button>
        </div>
      </div>
    `;
    
    const input = overlay.querySelector('#native-time-picker');
    
    overlay.querySelectorAll('[data-tp]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const action = e.currentTarget.dataset.tp;
        haptic('light');
        if (action === 'now') {
          const now = noRound ? new Date() : roundTo5(new Date());
          input.value = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        } else if (action === 'hour-back') {
          const [hh, mm] = input.value.split(':').map(Number);
          let newH = (hh - 1 + 24) % 24;
          input.value = `${newH.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}`;
        } else if (action === 'hour-forward') {
          const [hh, mm] = input.value.split(':').map(Number);
          let newH = (hh + 1) % 24;
          input.value = `${newH.toString().padStart(2,'0')}:${mm.toString().padStart(2,'0')}`;
        } else if (action === 'cancel') {
          overlay.remove(); resolve(null);
        } else if (action === 'ok') {
          const [hh, mm] = input.value.split(':').map(Number);
          const result = new Date(initialDate);
          result.setHours(hh, mm, 0, 0);
          overlay.remove();
          resolve(noRound ? result : roundTo5(result));
        }
      });
    });
    
    overlay.addEventListener('click', () => { overlay.remove(); resolve(null); });
    document.body.appendChild(overlay);
    
    setTimeout(() => input.focus(), 100);
  });
}

function showDatePicker(initialDate) {
  return new Promise((resolve) => {
    let currentMonth = new Date(initialDate.getFullYear(), initialDate.getMonth(), 1);
    let selectedDate = new Date(initialDate);
    
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    
    function renderPicker() {
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const monthName = currentMonth.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
      
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startDayOfWeek = (firstDay.getDay() + 6) % 7; // Lun = 0
      
      const cells = [];
      // Jours du mois précédent
      for (let i = startDayOfWeek - 1; i >= 0; i--) {
        const d = new Date(year, month, -i);
        cells.push({ date: d, otherMonth: true });
      }
      // Jours du mois
      for (let d = 1; d <= lastDay.getDate(); d++) {
        cells.push({ date: new Date(year, month, d), otherMonth: false });
      }
      // Jours du mois suivant (compléter)
      while (cells.length % 7 !== 0) {
        const lastCell = cells[cells.length - 1].date;
        const next = new Date(lastCell); next.setDate(next.getDate() + 1);
        cells.push({ date: next, otherMonth: true });
      }
      
      const today = new Date();
      
      overlay.innerHTML = `
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-handle"></div>
          <div class="modal-title">Choisir une date</div>
          
          <div class="date-nav">
            <button class="date-nav-btn" data-dp="prev">‹</button>
            <div class="date-nav-title">${monthName}</div>
            <button class="date-nav-btn" data-dp="next">›</button>
          </div>
          
          <div class="date-picker-grid">
            ${['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].map(d => `<div class="date-cell header">${d}</div>`).join('')}
            ${cells.map(c => {
              const isToday = c.date.toDateString() === today.toDateString();
              const isSelected = c.date.toDateString() === selectedDate.toDateString();
              return `<button class="date-cell ${c.otherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" data-dp="day" data-day="${c.date.toISOString()}">${c.date.getDate()}</button>`;
            }).join('')}
          </div>
          
          <div style="display:flex;gap:8px">
            <button class="btn btn-secondary" style="flex:1" data-dp="cancel">Annuler</button>
            <button class="btn btn-primary" style="flex:1" data-dp="ok">Valider</button>
          </div>
        </div>
      `;
      
      overlay.querySelectorAll('[data-dp]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const action = e.currentTarget.dataset.dp;
          haptic('light');
          switch (action) {
            case 'prev': currentMonth.setMonth(currentMonth.getMonth() - 1); renderPicker(); break;
            case 'next': currentMonth.setMonth(currentMonth.getMonth() + 1); renderPicker(); break;
            case 'day':
              selectedDate = new Date(e.currentTarget.dataset.day);
              renderPicker();
              break;
            case 'cancel':
              overlay.remove(); resolve(null); break;
            case 'ok':
              overlay.remove(); resolve(selectedDate); break;
          }
        });
      });
    }
    
    overlay.addEventListener('click', () => { overlay.remove(); resolve(null); });
    document.body.appendChild(overlay);
    renderPicker();
  });
}

function showConfirm(title, message, type = 'normal') {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>

          <button class="btn ${type === 'danger' ? 'btn-danger' : 'btn-primary'}" style="flex:1" data-cf="yes">Confirmer</button>
        </div>
      </div>
    `;
    overlay.querySelectorAll('[data-cf]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        overlay.remove();
        resolve(e.currentTarget.dataset.cf === 'yes');
      });
    });
    overlay.addEventListener('click', () => { overlay.remove(); resolve(false); });
    document.body.appendChild(overlay);
  });
}

function showPrompt(title, message, defaultValue = '', placeholder = '') {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">${escapeHtml(title)}</div>
        ${message ? `<div class="modal-subtitle">${escapeHtml(message)}</div>` : ''}

        <div style="display:flex;gap:8px">
          <button class="btn btn-secondary" style="flex:1" data-pr="no">Annuler</button>
          <button class="btn btn-primary" style="flex:1" data-pr="yes">Valider</button>
        </div>
      </div>
    `;
    const input = overlay.querySelector('#prompt-input');
    setTimeout(() => input.focus(), 100);
    
    overlay.querySelectorAll('[data-pr]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const yes = e.currentTarget.dataset.pr === 'yes';
        const val = input.value;
        overlay.remove();
        resolve(yes ? val : null);
      });
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = input.value;
        overlay.remove();
        resolve(val);
      }
    });
    overlay.addEventListener('click', () => { overlay.remove(); resolve(null); });
    document.body.appendChild(overlay);
  });
}

function showSyncModal() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-title">Synchronisation Google Sheets</div>
      <div class="modal-subtitle">Backup automatique de tes données dans une feuille Google Sheets que tu peux consulter depuis ton PC.</div>
      
      <div class="form-group">
        <label class="form-label">URL Apps Script (Web App)</label>
        <input type="url" class="form-input" id="sync-url" value="${escapeHtml(state.settings.syncUrl || '')}" placeholder="https://script.google.com/macros/s/.../exec">
        <div class="help-text">Obtenue après déploiement du script. Voir le guide.</div>
      </div>
      
      <div class="form-group">
        <label class="form-label">Token de sécurité</label>
        <input type="text" class="form-input" id="sync-token" value="${escapeHtml(state.settings.syncToken || '')}" placeholder="Token défini dans le script">
        <div class="help-text">Doit correspondre au TOKEN défini dans le code Apps Script.</div>
      </div>
      
      <div class="form-group">
        <label class="form-label" style="display:flex;align-items:center;gap:8px">
          <input type="checkbox" id="sync-enabled" ${state.settings.syncEnabled ? 'checked' : ''}>
          <span>Activer la synchronisation automatique</span>
        </label>
      </div>
      
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn btn-secondary" style="flex:1" data-sync="cancel">Annuler</button>
        <button class="btn btn-primary" style="flex:1" data-sync="save">Enregistrer</button>
      </div>
      ${state.settings.syncEnabled && state.settings.syncUrl ? `
        <button class="btn btn-ghost btn-block" style="margin-top:8px" data-sync="test">🔄 Tester la connexion</button>
      ` : ''}
    </div>
  `;
  
  overlay.querySelectorAll('[data-sync]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      const action = e.currentTarget.dataset.sync;
      if (action === 'cancel') { overlay.remove(); return; }
      if (action === 'save') {
        state.settings.syncUrl = $('#sync-url').value.trim();
        state.settings.syncToken = $('#sync-token').value.trim();
        state.settings.syncEnabled = $('#sync-enabled').checked;
        await saveSettings();
        overlay.remove();
        toast('Configuration sync sauvegardée', 'success');
        render();
        if (state.settings.syncEnabled) doSync(true);
      }
      if (action === 'test') {
        toast('Test en cours...', 'warning');
        await doSync(true);
      }
    });
  });
  
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
}

async function calculateDistance() {
  // Déterminer sur quel dossier on travaille : tempDossier (création) ou dossier existant (détail)
  let workingDossier = tempDossier;
  let isExisting = false;
  
  if (!workingDossier && view.dossierId) {
    workingDossier = state.dossiers.find(x => x.id === view.dossierId);
    isExisting = true;
  }
  
  if (!workingDossier) {
    toast('Aucun dossier en cours', 'error');
    return;
  }
  
  const destination = workingDossier.adresseSite;
  // L'ID du dossier en cours d'édition (pour l'exclure de la recherche du site précédent)
  const currentDossierId = workingDossier.id;
  
  if (!state.settings.syncUrl || !state.settings.syncToken) {
    toast('Configure d\'abord la sync Apps Script dans Réglages', 'error');
    return;
  }
  if (!destination) { toast('Saisis d\'abord l\'adresse du site', 'error'); return; }
  
  // Déterminer le point de départ selon le contexte
  const pointDepart = workingDossier.pointDepart || 'domicile';
  
  if (pointDepart === 'domicile') {
    if (!state.settings.adresseDomicile) {
      toast('Configure ton adresse domicile dans Réglages', 'error');
      return;
    }
    await performDistanceCalc(state.settings.adresseDomicile, destination, workingDossier, isExisting);
  } else if (pointDepart === 'autre-site') {
    await showChainOriginModal(destination, workingDossier, isExisting, currentDossierId);
  } else {
    await showOtherLocationModal(destination, workingDossier, isExisting);
  }
}

async function performDistanceCalc(origin, destination, dossier, isExisting) {
  if (!origin || !origin.trim()) {
    toast('Adresse de départ vide ou invalide', 'error');
    return;
  }
  
  toast('Calcul en cours...', 'warning');
  
  try {
    const payload = {
      token: state.settings.syncToken,
      action: 'calculate-distance',
      origin: origin,
      destination: destination
    };
    
    const response = await fetch(state.settings.syncUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    
    if (data.error) {
      toast('Erreur : ' + data.error, 'error');
      return;
    }
    
    if (!data.distanceKm || parseFloat(data.distanceKm) === 0) {
      toast('Distance 0 km ? Vérifie tes adresses', 'warning');
    }
    
    // Mettre à jour le dossier
    if (dossier) {
      dossier.km = data.distanceKm;
      haptic('success');
      toast(`📍 ${data.distanceKm} km (${data.durationText})`, 'success');
      
      // Si dossier déjà sauvegardé, persister la modif
      if (isExisting) {
        await saveDossier(dossier);
      }
      render();
    }
  } catch (err) {
    console.error(err);
    toast('Erreur réseau. Vérifie ta connexion.', 'error');
  }
}

// Modale pour le chaînage : choisir entre sites précédents ou GPS

  const candidates = findPreviousSitesInSequence(currentDossierId, dossier);
  
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  
  // Construire la liste des sites candidats
  let sitesHtml = '';
  if (candidates.length > 0) {
    sitesHtml = candidates.map((site, idx) => `
      <button class="modal-choice ${idx === 0 ? 'primary' : ''}" data-co="site" data-site-id="${site.id}">
        <div class="modal-choice-icon">🔗</div>
        <div class="modal-choice-content">
          <div class="modal-choice-title">${escapeHtml(site.etablissement)}</div>
          <div class="modal-choice-desc">${escapeHtml(site.adresseSite)} <span style="opacity:0.6">• ${fmtDateShort(site.dateAppel)} ${fmtTime(site.dateAppel)}</span></div>
        </div>
      </button>
    `).join('');
  }
  
  const subtitle = candidates.length > 1 
    ? `${candidates.length} sites précédents possibles. Choisis depuis lequel tu pars :`
    : candidates.length === 1
    ? 'Tu es en mode chaînage. D\'où viens-tu exactement ?'
    : 'Aucun site précédent enregistré. Choisis une autre option :';
  
  overlay.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-handle"></div>
      <div class="modal-title">D'où pars-tu ?</div>
      <div class="modal-subtitle">${subtitle}</div>
      <div class="modal-choices">
        ${sitesHtml}
        <button class="modal-choice ${candidates.length === 0 ? 'primary' : ''}" data-co="gps">
          <div class="modal-choice-icon">📍</div>
          <div class="modal-choice-content">
            <div class="modal-choice-title">Ma position GPS</div>
            <div class="modal-choice-desc">Utiliser le GPS du téléphone</div>
          </div>
        </button>
        <button class="modal-choice" data-co="manual">
          <div class="modal-choice-icon">✏️</div>
          <div class="modal-choice-content">
            <div class="modal-choice-title">Saisir manuellement</div>
            <div class="modal-choice-desc">Taper l'adresse de départ moi-même</div>
          </div>
        </button>
        <button class="modal-choice" data-co="cancel">
          <div class="modal-choice-icon">↩</div>
          <div class="modal-choice-content">
            <div class="modal-choice-title">Annuler</div>
            <div class="modal-choice-desc">Retour</div>
          </div>
        </button>
      </div>
    </div>
  `;
  
  overlay.querySelectorAll('[data-co]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      const choice = e.currentTarget.dataset.co;
      const siteId = e.currentTarget.dataset.siteId;
      overlay.remove();
      
      if (choice === 'cancel') return;
      
      if (choice === 'site' && siteId) {
        const selectedSite = candidates.find(s => s.id === siteId);
        if (selectedSite) {
          await performDistanceCalc(selectedSite.adresseSite, destination, dossier, isExisting);
        }
      } else if (choice === 'gps') {
        const gpsAddress = await getCurrentLocation();
        if (gpsAddress) {
          await performDistanceCalc(gpsAddress, destination, dossier, isExisting);
        }
      } else if (choice === 'manual') {
        const manual = await showPrompt('Adresse de départ', 'Tape ton adresse de départ actuelle', '', 'Ex: 12 rue de Paris, 78000 Versailles');
        if (manual) await performDistanceCalc(manual, destination, dossier, isExisting);
      }
    });
  });
  
  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);
}

// V2.9.7 — Logique correcte pour déterminer "site précédent" :
// - Si le dossier en cours a déjà une arrivée site → on ne propose que les dossiers arrivés AVANT
// - Si le dossier en cours n'a PAS encore d'arrivée site (tu n'y es pas allé) → tous les dossiers
//   avec une arrivée site sont automatiquement antérieurs (puisque tu n'y es pas encore allé)
function findPreviousSitesInSequence(excludeId = null, referenceDossier = null) {
  function getDossierTimestamp(d) {
    if (d.arriveeSite) return new Date(d.arriveeSite);
    if (d.departDomicile && d.departDomicile !== 'X') return new Date(d.departDomicile);
    return new Date(d.dateAppel);
  }
  
  // Le dossier de référence est-il "pas encore arrivé sur site" ?
  const referenceNotArrivedYet = referenceDossier && !referenceDossier.arriveeSite;
  
  const referenceTimestamp = referenceDossier 
    ? getDossierTimestamp(referenceDossier) 
    : new Date();
  
  const candidates = state.dossiers
    .filter(d => d.id !== excludeId)
    .filter(d => d.type === 'deplacement')
    .filter(d => d.adresseSite && d.adresseSite.trim())
    .filter(d => {
      // Si le dossier en cours n'a pas encore d'arrivée site,
      // tous les dossiers AVEC arrivée site sont candidats (tu y es déjà allé)
      if (referenceNotArrivedYet && d.arriveeSite) return true;
      
      // Sinon, filtre classique : antérieur en horaire d'intervention
      const candidateTs = getDossierTimestamp(d);
      return candidateTs <= referenceTimestamp;
    })
    .sort((a, b) => getDossierTimestamp(b) - getDossierTimestamp(a))
    .slice(0, 10);
  
  return candidates;
}

function findPreviousSiteInSequence(excludeId = null, referenceDossier = null) {
  const candidates = findPreviousSitesInSequence(excludeId, referenceDossier);
  return candidates.length > 0 ? candidates[0] : null;
}

// Géolocalisation + reverse geocoding
async function getCurrentLocation() {
  if (!('geolocation' in navigator)) {
    toast('Géolocalisation non supportée sur ce téléphone', 'error');
    return null;
  }
  
  toast('📡 Récupération de ta position...', 'warning');
  
  try {
    const position = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, {
        enableHighAccuracy: true,
        timeout: 10000,
        maximumAge: 60000 // accepte une position jusqu'à 1 min
      });
    });
    
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    
    // Geocoder via Apps Script
    const response = await fetch(state.settings.syncUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        token: state.settings.syncToken,
        action: 'geocode',
        lat: lat,
        lng: lng
      })
    });
    
    const data = await response.json();
    
    if (data.error) {
      toast('Geocoding : ' + data.error, 'error');
      return null;
    }
    
    haptic('success');
    toast(`📍 Position : ${data.address.substring(0, 40)}...`, 'success');
    return data.address;
  } catch (err) {
    if (err.code === 1) toast('Permission GPS refusée', 'error');
    else if (err.code === 2) toast('Position GPS indisponible', 'error');
    else if (err.code === 3) toast('Timeout GPS, réessaie', 'error');
    else toast('Erreur GPS : ' + err.message, 'error');
    return null;
  }
}

// Demander permission GPS au lancement (1 seule fois)
async function requestGeolocationPermission() {
  if (!('geolocation' in navigator)) return;
  // En appelant getCurrentPosition une fois, on déclenche la demande de permission
  // navigator.permissions n'est pas universel donc on fait soft
  try {
    navigator.geolocation.getCurrentPosition(
      () => { /* permission accordée, rien à faire */ },
      () => { /* permission refusée, on ne fait rien */ },
      { timeout: 1000, maximumAge: Infinity }
    );
  } catch(e) {}
}
