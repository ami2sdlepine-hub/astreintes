  --status-intervention: #fbbf24;
  --status-intervention-bg: rgba(251, 191, 36, 0.10);
  --status-intervention-border: rgba(251, 191, 36, 0.30);
  
  --status-done: #34d399;
  --status-done-bg: rgba(52, 211, 153, 0.10);
  --status-done-border: rgba(52, 211, 153, 0.30);
  
  --status-chain: #a78bfa;
  --status-chain-bg: rgba(167, 139, 250, 0.10);
  --status-chain-border: rgba(167, 139, 250, 0.30);
  
  --danger: #f87171;
  --danger-bg: rgba(248, 113, 113, 0.10);
  --danger-border: rgba(248, 113, 113, 0.30);
  
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.4), 0 4px 6px rgba(0, 0, 0, 0.2);
  --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.5);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background var(--transition), color var(--transition);
}

body { font-size: 15px; line-height: 1.5; }

#app {
  max-width: 500px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--bg);
  position: relative;
  padding-bottom: 80px;
}

/* ============================================================================
   HEADER
============================================================================ */
.app-header {
  position: sticky;
  top: 0;
  padding: max(env(safe-area-inset-top, 0px), 12px) 20px 12px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--border);
  z-index: 50;
}
[data-theme="dark"] .app-header { background: rgba(15, 23, 42, 0.85); }

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.header-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}
.header-back {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  color: var(--text);
  cursor: pointer;
  margin-left: -8px;
  font-size: 22px;
  transition: background var(--transition);
}
.header-back:active { background: var(--bg-muted); }
.header-subtitle {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 1px;
  font-weight: 500;
}
.header-actions { display: flex; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: transparent;
  border: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary);
  font-size: 18px;
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
}
.icon-btn:active { background: var(--bg-muted); }
.icon-btn.primary { background: var(--accent); color: var(--text-on-accent); }
.icon-btn.primary:active { background: var(--accent-hover); }

/* ============================================================================
   WEEK BANNER
============================================================================ */
.week-banner {
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.week-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.week-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
}
.week-dates {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.week-count {
  text-align: right;
}
.week-count-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
}
.week-count-label {
  font-size: 10px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
  margin-top: 4px;
}

/* ============================================================================
   SEQUENCE INDICATOR (séquence ouverte)
============================================================================ */
.sequence-indicator {
  margin: 12px 20px 0;
  padding: 12px 14px;
  background: var(--status-chain-bg);
  border: 1px solid var(--status-chain-border);
  border-radius: var(--radius);
  display: flex;
  align-items: center;
  gap: 10px;
}
.sequence-pulse {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--status-chain);
  position: relative;
  flex-shrink: 0;
}
.sequence-pulse::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--status-chain);
  animation: pulse 2s ease-out infinite;
  opacity: 0.6;
}
@keyframes pulse {
  to { transform: scale(2.5); opacity: 0; }
}
.sequence-text {
  flex: 1;
  font-size: 12px;
  color: var(--status-chain);
  font-weight: 600;
}
.sequence-text strong { display: block; font-size: 13px; font-weight: 700; margin-bottom: 2px; }
.sequence-action {
  font-size: 11px;
  color: var(--status-chain);
  font-weight: 700;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(124, 58, 237, 0.1);
}

/* ============================================================================
   FILTERS / SEGMENTED CONTROL
============================================================================ */
.filter-tabs {
  display: flex;
  gap: 6px;
  padding: 14px 20px 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.filter-tabs::-webkit-scrollbar { display: none; }
.filter-tab {
  padding: 7px 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 12px;
  color: var(--text-secondary);
  white-space: nowrap;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  font-family: inherit;
}
.filter-tab.active {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}
.filter-tab-count {
  display: inline-block;
  margin-left: 4px;
  font-family: 'JetBrains Mono', monospace;
  opacity: 0.7;
  font-size: 11px;
}

/* ============================================================================
   DOSSIER CARDS
============================================================================ */
.dossiers-list {
  padding: 8px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.dossier {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  transition: all var(--transition);
  position: relative;
  overflow: hidden;
}
.dossier::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--border-strong);
}
.dossier.status-call::before { background: var(--status-call); }
.dossier.status-intervention::before { background: var(--status-intervention); }
.dossier.status-done::before { background: var(--status-done); }
.dossier.status-pending::before { background: var(--text-tertiary); }
.dossier:active { transform: scale(0.99); background: var(--bg-subtle); }

.dossier-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 6px;
}
.dossier-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 600;
}
.dossier-badges { display: flex; gap: 4px; flex-shrink: 0; }
.badge {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  padding: 3px 8px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.badge-call { background: var(--status-call-bg); color: var(--status-call); border: 1px solid var(--status-call-border); }
.badge-intervention { background: var(--status-intervention-bg); color: var(--status-intervention); border: 1px solid var(--status-intervention-border); }
.badge-done { background: var(--status-done-bg); color: var(--status-done); border: 1px solid var(--status-done-border); }
.badge-pending { background: var(--bg-muted); color: var(--text-secondary); border: 1px solid var(--border); }
.badge-chain { background: var(--status-chain-bg); color: var(--status-chain); border: 1px solid var(--status-chain-border); }

.dossier-etablissement {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 3px;
  letter-spacing: -0.01em;
  color: var(--text);
}
.dossier-motif {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.4;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.dossier-meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--text-tertiary);
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
.dossier-meta span { display: flex; align-items: center; gap: 4px; font-weight: 500; }

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-tertiary);
}
.empty-state-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-state-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
.empty-state-desc { font-size: 13px; line-height: 1.5; max-width: 240px; margin: 0 auto; }

/* ============================================================================
   FAB
============================================================================ */
.fab {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  font-weight: 300;
  box-shadow: var(--shadow-lg), 0 0 0 4px var(--bg);
  cursor: pointer;
  z-index: 40;
  border: none;
  line-height: 1;
  transition: transform var(--transition);
}
.fab:active { transform: scale(0.95); }

/* ============================================================================
   BOTTOM NAV
============================================================================ */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-width: 500px;
  margin: 0 auto;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: saturate(180%) blur(12px);
  -webkit-backdrop-filter: saturate(180%) blur(12px);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 50;
}
[data-theme="dark"] .bottom-nav { background: rgba(15, 23, 42, 0.92); }
.nav-item {
  flex: 1;
  height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: var(--text-tertiary);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  padding: 6px;
  border: none;
  background: transparent;
  transition: color var(--transition);
}
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 22px; line-height: 1; }

/* ============================================================================
   FORMS
============================================================================ */
.form-screen { padding: 16px 20px 120px; }

.section {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
}

.section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 14px;
}

.form-group { margin-bottom: 14px; }
.form-group:last-child { margin-bottom: 0; }

.form-label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 6px;
  font-weight: 600;
}
.required { color: var(--danger); }

.form-input, .form-textarea, .form-select {
  width: 100%;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 14px;
  font-size: 15px;
  color: var(--text);
  font-family: inherit;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color var(--transition), background var(--transition);
}
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-tertiary); }
.form-textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.form-input:focus, .form-textarea:focus, .form-select:focus {
  outline: none;
  border-color: var(--accent);
  background: var(--bg-elevated);
}

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ============================================================================
   PICKER BUTTONS (date/time custom)
============================================================================ */
.picker-btn {
  width: 100%;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 14px;
  font-size: 15px;
  color: var(--text);
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: all var(--transition);
  font-variant-numeric: tabular-nums;
}
.picker-btn:active { background: var(--bg-muted); }
.picker-btn-icon { color: var(--text-tertiary); font-size: 16px; }
.picker-btn .rounded-pill {
  font-size: 9px;
  background: var(--accent);
  color: var(--text-on-accent);
  padding: 2px 6px;
  border-radius: 100px;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin-left: 6px;
}

/* ============================================================================
   TYPE SELECTOR (Tel / Déplacement)
============================================================================ */
.type-selector {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.type-option {
  background: var(--bg-subtle);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 12px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
}
.type-option:active { transform: scale(0.97); }
.type-option.selected.phone {
  background: var(--status-call-bg);
  border-color: var(--status-call);
}
.type-option.selected.move {
  background: var(--status-intervention-bg);
  border-color: var(--status-intervention);
}
.type-option .icon { font-size: 28px; margin-bottom: 6px; display: block; }
.type-option .label { font-size: 13px; font-weight: 700; color: var(--text); }
.type-option .desc { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }

/* ============================================================================
   RADIO OPTIONS
============================================================================ */
.radio-group { display: flex; flex-direction: column; gap: 8px; }
.radio-option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all var(--transition);
}
.radio-option:active { transform: scale(0.98); }
.radio-option.selected {
  border-color: var(--accent);
  background: var(--accent-subtle);
}
.radio-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  flex-shrink: 0;
  position: relative;
  transition: border-color var(--transition);
}
.radio-option.selected .radio-dot { border-color: var(--accent); }
.radio-option.selected .radio-dot::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
.radio-icon { font-size: 20px; }
.radio-content { flex: 1; }
.radio-title { font-size: 14px; font-weight: 600; color: var(--text); }
.radio-subtitle { font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }

/* ============================================================================
   TIMESTAMPS
============================================================================ */
.timestamp-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 12px 14px;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  transition: all var(--transition);
}
.timestamp-row.pending {
  border-color: var(--accent);
  background: var(--accent-subtle);
}
.timestamp-row.disabled { opacity: 0.5; }
.timestamp-row.crossed {
  background: var(--bg-muted);
  border-style: dashed;
}
.timestamp-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}
.timestamp-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}
.ts-actions { display: flex; gap: 4px; align-items: center; }
.ts-btn {
  background: var(--accent);
  color: white;
  border: none;
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  transition: all var(--transition);
}
.ts-btn:active { transform: scale(0.95); }
.ts-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.ts-btn.filled {
  background: var(--bg-elevated);
  color: var(--text);
  border: 1px solid var(--border);
}
.ts-btn-icon {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 7px 9px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}

/* ============================================================================
   DURATIONS DISPLAY
============================================================================ */
.duration-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}
.duration-card {
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  text-align: center;
}
.duration-card.payed {
  background: var(--status-done-bg);
  border-color: var(--status-done-border);
}
.duration-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}
.duration-card.payed .duration-value { color: var(--status-done); }
.duration-label {
  font-size: 10px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 4px;
  font-weight: 700;
}

/* ============================================================================
   BUTTONS
============================================================================ */
.btn {
  padding: 13px 16px;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all var(--transition);
  letter-spacing: -0.01em;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-block { width: 100%; }
.btn-primary { background: var(--accent); color: var(--text-on-accent); }
.btn-primary:active { background: var(--accent-hover); }
.btn-secondary { background: var(--bg-muted); color: var(--text); }
.btn-success { background: var(--status-done); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-ghost-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger-border); }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }

.form-actions {
  position: fixed;
  bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  left: 0; right: 0;
  max-width: 500px;
  margin: 0 auto;
  display: flex;
  gap: 8px;
  padding: 12px 20px;
  background: var(--bg);
  border-top: 1px solid var(--border);
  z-index: 49;
}
.form-actions.no-nav { bottom: env(safe-area-inset-bottom, 0px); }
.form-actions .btn { flex: 1; }

/* ============================================================================
   MODAL / BOTTOM SHEET
============================================================================ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: flex-end;
  z-index: 200;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

.modal {
  width: 100%;
  max-width: 500px;
  margin: 0 auto;
  background: var(--bg-elevated);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px));
  animation: slideUp 0.3s ease-out;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border-strong);
  border-radius: 2px;
  margin: 0 auto 18px;
}
.modal-title { font-size: 18px; font-weight: 800; text-align: center; margin-bottom: 6px; letter-spacing: -0.01em; }
.modal-subtitle { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 20px; line-height: 1.5; }
.modal-choices { display: flex; flex-direction: column; gap: 8px; }
.modal-choice {
  background: var(--bg-subtle);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  width: 100%;
  font-family: inherit;
  transition: all var(--transition);
}
.modal-choice:active { transform: scale(0.98); }
.modal-choice.primary { border-color: var(--accent); background: var(--accent-subtle); }
.modal-choice.danger { border-color: var(--danger); background: var(--danger-bg); }
.modal-choice-icon { font-size: 26px; }
.modal-choice-content { flex: 1; }
.modal-choice-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.modal-choice-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

/* ============================================================================
   TIME PICKER (Custom roulette)
============================================================================ */
.time-picker-display {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 24px 0;
  background: var(--bg-subtle);
  border-radius: var(--radius-lg);
  margin-bottom: 16px;
  font-family: 'JetBrains Mono', monospace;
}
.time-segment {
  font-size: 48px;
  font-weight: 800;
  color: var(--text);
  min-width: 80px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.04em;
}
.time-colon { font-size: 40px; color: var(--text-tertiary); font-weight: 300; }

.time-picker-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.time-control-column { display: flex; flex-direction: column; gap: 6px; }
.time-control-label {
  text-align: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
}
.time-control-btns { display: flex; gap: 6px; justify-content: center; }
.time-ctrl-btn {
  background: var(--bg-muted);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  min-width: 44px;
  font-family: inherit;
}
.time-ctrl-btn:active { background: var(--bg-hover); }
.time-ctrl-btn.now {
  background: var(--accent);
  color: var(--text-on-accent);
  border-color: var(--accent);
  width: 100%;
}

.time-quick-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-bottom: 16px;
}
.time-quick {
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 6px;
  font-size: 13px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
  cursor: pointer;
}
.time-quick:active { background: var(--bg-muted); }

/* ============================================================================
   DATE PICKER
============================================================================ */
.date-picker-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin: 16px 0;
}
.date-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  background: transparent;
  border: 1px solid transparent;
}
.date-cell.header { font-size: 10px; font-weight: 700; color: var(--text-tertiary); cursor: default; text-transform: uppercase; }
.date-cell.other-month { color: var(--text-tertiary); opacity: 0.4; }
.date-cell:not(.header):active { background: var(--bg-muted); }
.date-cell.today { border-color: var(--accent); color: var(--accent); }
.date-cell.selected { background: var(--accent); color: var(--text-on-accent); }
.date-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.date-nav-btn {
  background: var(--bg-muted);
  border: none;
  width: 36px; height: 36px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  color: var(--text);
}
.date-nav-title {
  font-weight: 700;
  font-size: 15px;
  color: var(--text);
}

/* ============================================================================
   SETTINGS
============================================================================ */
.settings-section { margin-bottom: 20px; }
.settings-section-title {
  font-size: 11px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
  padding-left: 14px;
  font-weight: 700;
}
.settings-group {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.settings-row {
  display: flex;
  align-items: center;
  padding: 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background var(--transition);
}
.settings-row:active { background: var(--bg-subtle); }
.settings-row:last-child { border-bottom: none; }
.settings-row-icon {
  width: 32px; height: 32px;
  background: var(--bg-subtle);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  margin-right: 12px;
  flex-shrink: 0;
}
.settings-row-content { flex: 1; min-width: 0; }
.settings-row-title { font-size: 14px; font-weight: 600; color: var(--text); }
.settings-row-value {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.settings-row-chevron { color: var(--text-tertiary); font-size: 18px; flex-shrink: 0; margin-left: 8px; }

/* Theme selector buttons */
.theme-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 14px;
}
.theme-option {
  padding: 14px 8px;
  background: var(--bg-subtle);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  text-align: center;
  transition: all var(--transition);
}
.theme-option.active { border-color: var(--accent); background: var(--accent-subtle); }
.theme-option-icon { font-size: 22px; margin-bottom: 4px; display: block; }
.theme-option-label { font-size: 12px; font-weight: 600; color: var(--text); }

/* ============================================================================
   EXPORT CARDS
============================================================================ */
.export-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: all var(--transition);
}
.export-card:active { transform: scale(0.99); }
.export-card.primary { border-color: var(--accent); }
.export-card.pdf { border-color: var(--danger); }
.export-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.export-icon-box {
  width: 42px; height: 42px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.export-title { font-size: 14px; font-weight: 700; color: var(--text); }
.export-subtitle { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.export-stats {
  display: flex;
  gap: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.export-stat { display: flex; flex-direction: column; gap: 2px; }
.export-stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.01em;
}
.export-stat-label {
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 9px;
  font-weight: 700;
}

/* ============================================================================
   DETAIL VIEW
============================================================================ */
.status-banner {
  padding: 12px 14px;
  border-radius: var(--radius);
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.status-banner.intervention { background: var(--status-intervention-bg); border: 1px solid var(--status-intervention-border); }
.status-banner.done { background: var(--status-done-bg); border: 1px solid var(--status-done-border); }
.status-banner.call { background: var(--status-call-bg); border: 1px solid var(--status-call-border); }
.status-banner.pending { background: var(--bg-subtle); border: 1px solid var(--border); }

.detail-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.detail-row:last-child { border-bottom: none; }
.detail-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; flex-shrink: 0; }
.detail-value { font-size: 13px; color: var(--text); font-weight: 600; text-align: right; flex: 1; word-break: break-word; }
.detail-value.mono { font-family: 'JetBrains Mono', monospace; }
.detail-block { padding: 10px 0; border-bottom: 1px solid var(--border); }
.detail-block:last-child { border-bottom: none; }
.detail-block-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; margin-bottom: 6px; }
.detail-block-content { font-size: 14px; color: var(--text); line-height: 1.5; }

/* V2.9.8 — Édition inline dans le détail */
.detail-input {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  font-size: 13px;
  color: var(--text);
  font-weight: 600;
  flex: 1;
  text-align: right;
  min-width: 0;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}
.detail-input:focus {
  border-color: var(--accent);
  background: var(--bg);
  text-align: left;
}
.detail-input.mono {
  font-family: 'JetBrains Mono', monospace;
}
.detail-input::placeholder {
  color: var(--text-tertiary);
  font-weight: 400;
}

/* ============================================================================
   STATS
============================================================================ */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.stat-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
}
.stat-value {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px;
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.03em;
  line-height: 1;
}
.stat-label {
  font-size: 10px;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 6px;
  font-weight: 700;
}
.stat-card.accent { background: var(--accent-subtle); border-color: var(--accent-border); }
.stat-card.accent .stat-value { color: var(--accent); }

/* ============================================================================
   SEQUENCE TIMELINE
============================================================================ */
.sequence-timeline {
  position: relative;
  padding-left: 8px;
}
.seq-step {
  position: relative;
  padding-left: 32px;
  padding-bottom: 16px;
}
.seq-step:not(:last-child)::before {
  content: '';
  position: absolute;
  left: 11px;
  top: 24px;
  bottom: -4px;
  width: 2px;
  background: var(--border);
}
.seq-step-dot {
  position: absolute;
  left: 5px;
  top: 6px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 3px solid var(--bg);
  z-index: 1;
  box-shadow: 0 0 0 2px var(--border);
}
.seq-step-content {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  cursor: pointer;
  transition: all 0.15s;
}
.seq-step-content:active {
  transform: scale(0.98);
  background: var(--bg-subtle);
}
.seq-chain-arrow {
  position: relative;
  left: -18px;
  margin: -4px 0 0 0;
  padding: 4px 8px;
  color: var(--status-chain);
  font-size: 11px;
  font-weight: 600;
  text-align: left;
}

/* ============================================================================
   TOAST
============================================================================ */
.toast-container {
  position: fixed;
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  left: 0; right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  z-index: 1000;
  pointer-events: none;
}
.toast {
  background: var(--text);
  color: var(--bg);
  padding: 10px 16px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: var(--shadow-lg);
  max-width: 90%;
  animation: toastIn 0.3s ease-out;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.success { background: var(--status-done); color: white; }
.toast.error { background: var(--danger); color: white; }
.toast.warning { background: var(--status-intervention); color: white; }
@keyframes toastIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* ============================================================================
   HELPERS
============================================================================ */
.hidden { display: none !important; }
.text-center { text-align: center; }
.help-text { font-size: 11px; color: var(--text-tertiary); margin-top: 6px; line-height: 1.4; }

.warning-inline {
  background: var(--status-intervention-bg);
  border: 1px solid var(--status-intervention-border);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 12px;
  color: var(--status-intervention);
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.sync-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 100px;
}
.sync-badge.ok { background: var(--status-done-bg); color: var(--status-done); }
.sync-badge.pending { background: var(--status-intervention-bg); color: var(--status-intervention); }
.sync-badge.error { background: var(--danger-bg); color: var(--danger); }
.sync-badge.off { background: var(--bg-muted); color: var(--text-tertiary); }

.sync-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.sync-badge.pending .sync-dot { animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: 0.3; } }

</style>

const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).substring(2, 9);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function roundTo5(date) {
  const d = new Date(date);
  const rounded = Math.round(d.getMinutes() / 5) * 5;
  d.setMinutes(rounded); d.setSeconds(0); d.setMilliseconds(0);
  return d;
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fmtDateShort(d) {
  if (!d) return '—';
  return new Date(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}
function fmtTime(d) {
  if (!d) return '—';
  return new Date(d).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}
function fmtDateTime(d) { return fmtDate(d) + ' • ' + fmtTime(d); }

function fmtDuration(ms) {
  if (!ms || ms < 0) return '—';
  const total = Math.round(ms / 60000);
  const h = Math.floor(total / 60);
  const m = total % 60;
  return `${h}h${m.toString().padStart(2, '0')}`;
}

function diffMs(start, end) {
  if (!start || !end) return 0;
  return new Date(end) - new Date(start);
}

function getAstreinteWeek(date = new Date()) {
  const d = new Date(date);
  const day = d.getDay();
  const hours = d.getHours();
  let daysToMonday;
  if (day === 1 && hours < 9) daysToMonday = -7;
  else if (day === 0) daysToMonday = -6;
  else daysToMonday = -(day - 1);
  
  const start = new Date(d);
  start.setDate(d.getDate() + daysToMonday);
  start.setHours(9, 0, 0, 0);
  const end = new Date(start);
  end.setDate(start.getDate() + 7);
  
  const yearStart = new Date(start.getFullYear(), 0, 1);
  const daysSinceYearStart = Math.floor((start - yearStart) / 86400000);
  const weekNumber = Math.ceil((daysSinceYearStart + yearStart.getDay()) / 7);
  
  return { start, end, weekNumber };
}

function haptic(type = 'light') {
  if (!('vibrate' in navigator)) return;
  const patterns = { light: 10, medium: 20, heavy: [10, 30, 10], success: [10, 30, 10, 30, 10] };
  navigator.vibrate(patterns[type] || 10);
}

const DB_NAME = 'astreintes_ami2s';
const DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains('dossiers')) {
        const store = database.createObjectStore('dossiers', { keyPath: 'id' });
        store.createIndex('dateAppel', 'dateAppel');
        store.createIndex('sequenceId', 'sequenceId');
      }
      if (!database.objectStoreNames.contains('settings')) {
        database.createObjectStore('settings', { keyPath: 'key' });
      }
    };
  });
}

function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(store, value) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(value);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

function dbClear(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).clear();
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

let syncTimeout = null;
function scheduleSync() {
  if (!state.settings.syncEnabled || !state.settings.syncUrl) return;
  syncStatus = 'pending';
  updateSyncBadge();
  if (syncTimeout) clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => doSync(), 3000);
}

async function doSync(showFeedback = false) {
  if (!state.settings.syncEnabled || !state.settings.syncUrl) {
    syncStatus = 'off';
    updateSyncBadge();
    return;
  }
  
  syncStatus = 'pending';
  updateSyncBadge();
  
  try {
    const payload = {
      token: state.settings.syncToken,
      action: 'sync',
      technicien: state.settings.technicien,
      dossiers: state.dossiers,
      settings: state.settings,
      clientTime: new Date().toISOString()
    };
    
    const response = await fetch(state.settings.syncUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const result = await response.json();
    if (result.error) throw new Error(result.error);
    
    state.settings.lastSync = new Date().toISOString();
    await saveSettings();
    syncStatus = 'ok';
    updateSyncBadge();
    
    if (showFeedback) {
      toast('Synchronisation réussie • ' + (result.count || 0) + ' dossiers', 'success');
    }
  } catch (err) {
    console.error('Sync error', err);
    syncStatus = 'error';
    updateSyncBadge();
    if (showFeedback) toast('Erreur de sync : ' + err.message, 'error');
  }
}

// Pull depuis Google Sheets (sync bidirectionnelle)
async function doPull(showFeedback = false) {
  if (!state.settings.syncEnabled || !state.settings.syncUrl) {
    if (showFeedback) toast('Sync non configurée', 'error');
    return;
  }
  
  syncStatus = 'pending';
  updateSyncBadge();
  
  try {
    const payload = {
      token: state.settings.syncToken,
      action: 'pull',
      technicien: state.settings.technicien
    };
    
    const response = await fetch(state.settings.syncUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const result = await response.json();
    if (result.error) throw new Error(result.error);
    
    // Fusionner avec les dossiers locaux : on garde le plus récent (updatedAt) pour chaque ID
    const remoteDossiers = result.dossiers || [];
    const localById = {};
    state.dossiers.forEach(d => { localById[d.id] = d; });
    
    let added = 0, updated = 0;
    for (const remote of remoteDossiers) {
      const local = localById[remote.id];
      if (!local) {
        // Nouveau dossier venu du cloud
        await dbPut('dossiers', remote);
        state.dossiers.push(remote);
        added++;
      } else {
        // Conflit : garder celui qui a le updatedAt le plus récent
        const localTime = new Date(local.updatedAt || local.createdAt || 0).getTime();
        const remoteTime = new Date(remote.updatedAt || remote.createdAt || 0).getTime();
        if (remoteTime > localTime) {
          await dbPut('dossiers', remote);
          const idx = state.dossiers.findIndex(x => x.id === remote.id);
          if (idx >= 0) state.dossiers[idx] = remote;
          updated++;
        }
      }
    }
    
    // Récupérer aussi les réglages partagés
    if (result.settings) {
      const remoteSettings = result.settings;
      // Ne pas écraser les credentials locaux (syncUrl, syncToken) ni le thème local
      const preserved = ['syncUrl', 'syncToken', 'syncEnabled', 'lastSync', 'theme'];
      for (const key in remoteSettings) {
        if (!preserved.includes(key) && remoteSettings[key]) {
          state.settings[key] = remoteSettings[key];
        }
      }
      await saveSettings();
    }
    
    syncStatus = 'ok';
    updateSyncBadge();
    
    if (showFeedback) {
      toast(`Synchronisé : ${added} ajoutés, ${updated} mis à jour`, 'success');
    }
    render();
  } catch (err) {
    console.error('Pull error', err);
    syncStatus = 'error';
    updateSyncBadge();
    if (showFeedback) toast('Erreur de pull : ' + err.message, 'error');
  }
}

// Sync complète : pull + push (utilise au démarrage et manuellement)
async function doFullSync(showFeedback = false) {
  if (!state.settings.syncEnabled || !state.settings.syncUrl) {
    if (showFeedback) toast('Sync non configurée', 'error');
    return;
  }
  
  if (showFeedback) toast('Synchronisation complète...', 'warning');
  
  await doPull(false);
  await doSync(false);
  
  if (showFeedback) {
    toast('Synchronisation complète réussie', 'success');
  }
}

function updateSyncBadge() {
  // Met à jour le badge sync dans Réglages si visible
  const badge = $('#sync-badge');
  if (badge) badge.outerHTML = renderSyncBadge();
}

function renderSyncBadge() {
  if (!state.settings.syncEnabled) return `<span class="sync-badge off" id="sync-badge"><span class="sync-dot"></span>Désactivé</span>`;
  const map = {
    ok: `<span class="sync-badge ok" id="sync-badge"><span class="sync-dot"></span>Synchronisé</span>`,
    pending: `<span class="sync-badge pending" id="sync-badge"><span class="sync-dot"></span>En cours...</span>`,
    error: `<span class="sync-badge error" id="sync-badge"><span class="sync-dot"></span>Erreur</span>`,
    off: `<span class="sync-badge off" id="sync-badge"><span class="sync-dot"></span>Non configuré</span>`

  return map[syncStatus] || map.off;
}

function getWeekDossiers(offset = 0) {
  const base = new Date();
  base.setDate(base.getDate() + offset * 7);
  const { start, end } = getAstreinteWeek(base);
  return state.dossiers.filter(d => {
    const dt = new Date(d.dateAppel);
    return dt >= start && dt < end;
  });
}

function getFilteredDossiers() {
  let dossiers = view.weekOffset !== null ? getWeekDossiers(view.weekOffset) : state.dossiers;
  dossiers = [...dossiers].sort((a, b) => new Date(b.dateAppel) - new Date(a.dateAppel));
  
  // Filtre catégorie
  if (view.filter === 'en-cours') dossiers = dossiers.filter(d => d.statut === 'intervention');
  else if (view.filter === 'appels') dossiers = dossiers.filter(d => d.type === 'telephone');
  else if (view.filter === 'clotures') dossiers = dossiers.filter(d => d.statut === 'cloture');
  
  // Filtre recherche
  if (view.searchQuery && view.searchQuery.trim()) {
    const q = view.searchQuery.toLowerCase().trim();
    dossiers = dossiers.filter(d =>
      (d.etablissement || '').toLowerCase().includes(q) ||
      (d.motif || '').toLowerCase().includes(q) ||
      (d.codeAstreinte || '').toLowerCase().includes(q) ||
      (d.rapportN || '').toLowerCase().includes(q) ||
      (d.compteRendu || '').toLowerCase().includes(q)
    );
  }
  
  return dossiers;
}

function getDossierStatus(d) {
  if (d.type === 'telephone') return d.statut === 'cloture' ? 'call-closed' : 'pending';
  if (d.statut === 'cloture') return 'done';
  if (d.statut === 'intervention') return 'intervention';
  return 'pending';
}

function getBadge(d) {
  const s = getDossierStatus(d);
  switch (s) {
    case 'call-closed': return { class: 'badge-call', text: '☎ Téléphone', card: 'status-call' };
    case 'intervention': return { class: 'badge-intervention', text: '⚠ En cours', card: 'status-intervention' };
    case 'done': return { class: 'badge-done', text: '✓ Clôturé', card: 'status-done' };
    default: return { class: 'badge-pending', text: '◷ En attente', card: 'status-pending' };
  }
}

function findOpenSequence() {
  // Logique V2.5 plus tolérante : un dossier "ouvert" est :
  // - en statut "intervention" (en cours), OU
  // - clôturé avec retourDomicile = 'X' (chaînage en cours, n'a pas encore enregistré retour)
  // ET qui n'a PAS de retour domicile horodaté (sinon la séquence est fermée)
  
  const candidatesEnCours = state.dossiers.filter(d => 
    d.statut === 'intervention' && d.retourDomicile !== 'X' && !d.retourDomicile && d.type === 'deplacement'
  );
  
  const candidatesChaines = state.dossiers.filter(d =>
    d.retourDomicile === 'X' && d.type === 'deplacement'
  );
  
  const allCandidates = [...candidatesEnCours, ...candidatesChaines];
  if (allCandidates.length === 0) return null;
  
  // Si on a plusieurs candidats avec des sequenceId différents, prendre le plus récent
  const sortedByDate = allCandidates.sort((a, b) => new Date(b.dateAppel) - new Date(a.dateAppel));
  const latestDossier = sortedByDate[0];
  
  // Récupérer tous les dossiers de la même séquence
  const seqId = latestDossier.sequenceId;
  if (!seqId) {
    return { sequenceId: latestDossier.id, dossiers: [latestDossier] };
  }
  
  // Vérifier qu'aucun dossier de la séquence n'a un retour domicile horodaté
  const seqDossiers = state.dossiers.filter(d => d.sequenceId === seqId);
  const hasRealRetour = seqDossiers.some(d => d.retourDomicile && d.retourDomicile !== 'X');
  if (hasRealRetour) return null;
  
  return { sequenceId: seqId, dossiers: seqDossiers };
}

function recalcDurations(d) {
  if (d.arriveeSite && d.departSite) {
    d.tempsSiteMs = diffMs(d.arriveeSite, d.departSite);
    d.tempsSiteCalcule = fmtDuration(d.tempsSiteMs);
  }
  // Calcul total trajet : seulement si les deux ne sont pas X
  if (d.departDomicile && d.retourDomicile && d.departDomicile !== 'X' && d.retourDomicile !== 'X') {
    d.totalTrajetMs = diffMs(d.departDomicile, d.retourDomicile);
    d.totalTrajetCalcule = fmtDuration(d.totalTrajetMs);
  } else if (d.departDomicile === 'X' || d.retourDomicile === 'X') {
    d.totalTrajetMs = null;
    d.totalTrajetCalcule = null;
  }
}

  switch (view.current) {

    case 'new': app.innerHTML = renderNewDossier(); break;
    case 'detail': app.innerHTML = renderDetail(); break;
    case 'export': app.innerHTML = renderExport(); break;
    case 'settings': app.innerHTML = renderSettings(); break;
    case 'stats': app.innerHTML = renderStats(); break;
    case 'sequence': app.innerHTML = renderSequence(); break;
  }
  attachListeners();
  
  // Wake lock pendant les saisies
  if (view.current === 'new' || view.current === 'detail') {
    requestWakeLock();
  } else {
    releaseWakeLock();
  }
  
  // V2.9.2 — Rafraîchissement auto de la page Stats toutes les 60 secondes
  // (pour mettre à jour le total estimé des séquences en cours)
  if (statsRefreshTimer) {
    clearInterval(statsRefreshTimer);
    statsRefreshTimer = null;
  }
  if (view.current === 'stats' || view.current === 'sequence') {
    statsRefreshTimer = setInterval(() => {
      if (view.current === 'stats' || view.current === 'sequence') {
        render();
      } else {
        clearInterval(statsRefreshTimer);
        statsRefreshTimer = null;
      }
    }, 60000); // Toutes les 60 secondes
  }
}

// ----- DETAIL -----
function renderDetail() {
  const d = state.dossiers.find(x => x.id === view.dossierId);
  if (!d) { view.current = 'list'; return renderList(); }
  
  const b = getBadge(d);
  const status = getDossierStatus(d);
  
  // V2.9.4 — Détecter si ce dossier fait partie d'une séquence chaînée
  // (a un départ ou retour à X)
  const isInChain = d.departDomicile === 'X' || d.retourDomicile === 'X';
  let chainInfo = null;
  
  if (isInChain && d.type === 'deplacement') {
    // Reconstruire la séquence : tous les dossiers déplacement de la semaine, dans l'ordre
    const week = getAstreinteWeek();
    const weekDossiers = getWeekDossiers(0).filter(x => x.type === 'deplacement');
    const sorted = [...weekDossiers].sort((a, b) => new Date(a.dateAppel) - new Date(b.dateAppel));
    
    // Trouver le groupe auquel appartient ce dossier
    let currentGroup = null;
    const groups = [];
    
    for (const dx of sorted) {
      if (dx.departDomicile && dx.departDomicile !== 'X') {
        if (currentGroup) groups.push(currentGroup);
        currentGroup = { dossiers: [dx], firstDepart: dx.departDomicile, lastRetour: null };
      } else if (dx.departDomicile === 'X' && currentGroup) {
        currentGroup.dossiers.push(dx);
      } else if (dx.departDomicile === 'X' && !currentGroup) {
        currentGroup = { dossiers: [dx], firstDepart: null, lastRetour: null };
      }
      
      if (dx.retourDomicile && dx.retourDomicile !== 'X' && currentGroup) {
        currentGroup.lastRetour = dx.retourDomicile;
        groups.push(currentGroup);
        currentGroup = null;
      }
    }
    if (currentGroup) groups.push(currentGroup);
    
    // Trouver le groupe qui contient le dossier en cours
    const myGroup = groups.find(g => g.dossiers.some(x => x.id === d.id));
    
    if (myGroup && myGroup.dossiers.length > 1) {
      function safeDiff(start, end) {
        if (!start || !end) return 0;
        const startDate = new Date(start);
        const endDate = new Date(end);
        let ms = endDate - startDate;
        if (ms < 0) {
          const startMin = startDate.getHours() * 60 + startDate.getMinutes();
          const endMin = endDate.getHours() * 60 + endDate.getMinutes();
          let diffMin = endMin - startMin;
          if (diffMin < 0) diffMin += 24 * 60;
          ms = diffMin * 60 * 1000;
        }
        if (ms > 24 * 3600 * 1000) {
          const startMin = startDate.getHours() * 60 + startDate.getMinutes();
          const endMin = endDate.getHours() * 60 + endDate.getMinutes();
          let diffMin = endMin - startMin;
          if (diffMin < 0) diffMin += 24 * 60;
          ms = diffMin * 60 * 1000;
        }
        return ms;
      }
      
      let totalMs = 0;
      let statusLabel = '';
      if (myGroup.firstDepart && myGroup.lastRetour) {
        totalMs = safeDiff(myGroup.firstDepart, myGroup.lastRetour);
        statusLabel = 'Total séquence (clôturée)';
      } else if (myGroup.firstDepart) {
        totalMs = safeDiff(myGroup.firstDepart, new Date());
        statusLabel = 'Total séquence (en cours)';
      }
      
      // Position du dossier dans la séquence
      const myIndex = myGroup.dossiers.findIndex(x => x.id === d.id);
      const position = myIndex === 0 ? '1er (début)' :
                       myIndex === myGroup.dossiers.length - 1 ? `${myIndex + 1}e (fin)` :
                       `${myIndex + 1}e (milieu)`;
      
      chainInfo = {
        totalMs,
        statusLabel,
        nbDossiers: myGroup.dossiers.length,
        position,
        dossiers: myGroup.dossiers
      };
    }
  }
  
  return `
    <header class="app-header">
      <div class="header-top">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0">
          <span class="header-back" data-action="nav" data-view="list">←</span>
          <div style="min-width:0;flex:1">
            <div class="header-title" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(d.codeAstreinte || d.etablissement)}</div>
            <div class="header-subtitle">${escapeHtml(d.etablissement)}</div>
          </div>
        </div>
      </div>
    </header>
    
    <div class="form-screen">
      <div class="status-banner ${status === 'intervention' ? 'intervention' : status === 'done' ? 'done' : status === 'call-closed' ? 'call' : 'pending'}">
        <span class="badge ${b.class}">${b.text}</span>
        <span style="font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-secondary)">${fmtDateTime(d.dateAppel)}</span>
      </div>
      
      ${chainInfo ? `
        <div class="section" style="background:var(--status-chain-bg);border:1px solid var(--status-chain-border);padding:14px 16px;margin-top:12px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
            <span style="font-size:20px">🔗</span>
            <div style="flex:1">
              <div style="font-weight:700;color:var(--status-chain);font-size:14px">Fait partie d'une séquence chaînée</div>
              <div style="font-size:12px;color:var(--text-secondary);margin-top:2px">Position : ${chainInfo.position} • ${chainInfo.nbDossiers} dossiers au total</div>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg-elevated);border-radius:var(--radius);margin-top:6px">
            <span style="font-size:12px;color:var(--text-secondary)">${chainInfo.statusLabel}</span>
            <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;color:var(--status-chain)">${chainInfo.totalMs ? fmtDuration(chainInfo.totalMs) : '—'}</span>
          </div>
          <button class="btn btn-secondary" data-action="show-sequence" style="width:100%;margin-top:10px;font-size:13px">
            🔗 Voir toute la séquence →
          </button>
        </div>
      ` : ''}
      
      <div class="section">
        <div class="section-title">📋 Informations</div>
        <div class="detail-row">
          <span class="detail-label">Établissement</span>
          <input type="text" class="detail-input" data-bind-edit="etablissement" value="${escapeHtml(d.etablissement || '')}" placeholder="Nom de l'établissement">
        </div>
        <div class="detail-row">
          <span class="detail-label">Code astreinte</span>
          <input type="text" class="detail-input mono" data-bind-edit="codeAstreinte" value="${escapeHtml(d.codeAstreinte || '')}" placeholder="Ex: AST-0847">

        <div class="detail-row">

          <span class="detail-value">${d.bureau ? '📞 Bureau' : fmtDateTime(d.dateAppel)}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Type</span>
          <span class="detail-value">${d.type === 'telephone' ? '☎ Téléphone' : '🚗 Déplacement'}</span>

        <div class="detail-block">

          <textarea class="form-textarea" data-bind-edit="motif" placeholder="Décrire la nature de l'appel" style="min-height:60px">${escapeHtml(d.motif || '')}</textarea>
        </div>
      </div>
      
      ${d.type === 'deplacement' ? renderDetailHoraires(d) : ''}
      
      ${d.type === 'deplacement' ? `

        </div>
        
      ${d.type === 'deplacement' ? `
        <div class="section">
          <div class="section-title">📊 Site & distance</div>
          <div class="detail-row">
            <span class="detail-label">N° rapport</span>
            <input type="text" class="detail-input mono" data-bind-edit="rapportN" value="${escapeHtml(d.rapportN || '')}" placeholder="Ex: R-2026-0312">
          </div>
          <div class="detail-row">

            <input type="text" class="detail-input" data-bind-edit="adresseSite" value="${escapeHtml(d.adresseSite || '')}" placeholder="Adresse complète">
          </div>
          <div class="detail-row">

              <input type="number" class="detail-input mono" data-bind-edit="km" value="${escapeHtml(d.km || '')}" placeholder="0.0" step="0.1" inputmode="decimal" style="width:80px;text-align:right">

          </div>

      <div class="section" style="display:flex;flex-direction:column;gap:8px">

            ✓ Dossier clôturé • Modifications enregistrées automatiquement

        <button class="btn btn-ghost-danger btn-block" data-action="delete">🗑 Supprimer</button>

function renderTimestamp(d, field, label, icon) {
  const value = d[field];
  const isFilled = !!value;
  const isCrossed = value === 'X';
  
  let disabled = false;
  if (field === 'arriveeSite' && !d.departDomicile && d.pointDepart === 'domicile') disabled = true;
  // Pour le chaînage (départ domicile = X), arrivée site est OK
  if (field === 'departSite' && !d.arriveeSite) disabled = true;
  if (field === 'retourDomicile' && !d.departSite) disabled = true;
  
  // Cas spécial : timestamp avec un X (chaînage)
  if (isCrossed) {
    const subText = field === 'departDomicile' ? '✕ Pas de départ (chaînage entrant)' : '✕ Pas de retour (chaînage)';
    return `
      <div class="timestamp-row crossed">
        <div>
          <div class="timestamp-label">${icon} ${label}</div>
          <div class="timestamp-sub">${subText}</div>
        </div>
        <div class="ts-actions">
          <button class="ts-btn-icon" data-action="edit-ts" data-field="${field}">✏</button>
          <button class="ts-btn-icon" data-action="clear-ts" data-field="${field}">↩</button>
        </div>
      </div>
    `;
  }
  
  // Cas spécial : Retour domicile vide avec bouton "Pas de retour"
  if (field === 'retourDomicile' && !isFilled) {
    return `
      <div class="timestamp-row ${disabled ? 'disabled' : 'pending'}">
        <div>
          <div class="timestamp-label">${icon} ${label}</div>
          <div class="timestamp-sub">${disabled ? '—' : 'En attente'}</div>
        </div>
        <div class="ts-actions">
          <button class="ts-btn" data-action="ts-now" data-field="${field}" ${disabled ? 'disabled' : ''} style="padding:9px 12px">Rentré</button>
          <button class="ts-btn-icon" data-action="edit-ts" data-field="${field}" ${disabled ? 'disabled' : ''} title="Modifier l'heure">✏</button>
          <button class="ts-btn-icon" data-action="ts-cross" data-field="${field}" ${disabled ? 'disabled' : ''} title="Pas de retour (chaînage)" style="color:var(--status-chain)">✕</button>
        </div>
      </div>
    `;
  }
  
  // Cas spécial : Départ domicile vide avec bouton "Pas de départ" (chaînage entrant)
  if (field === 'departDomicile' && !isFilled) {
    return `
      <div class="timestamp-row ${disabled ? 'disabled' : 'pending'}">
        <div>
          <div class="timestamp-label">${icon} ${label}</div>
          <div class="timestamp-sub">${disabled ? '—' : 'En attente'}</div>
        </div>
        <div class="ts-actions">
          <button class="ts-btn" data-action="ts-now" data-field="${field}" ${disabled ? 'disabled' : ''}>Maintenant</button>
          <button class="ts-btn-icon" data-action="edit-ts" data-field="${field}" ${disabled ? 'disabled' : ''} title="Modifier l'heure">✏</button>
          <button class="ts-btn-icon" data-action="ts-cross" data-field="${field}" ${disabled ? 'disabled' : ''} title="Pas de départ du domicile (chaînage)" style="color:var(--status-chain)">✕</button>
        </div>
      </div>
    `;
  }
  
  return `
    <div class="timestamp-row ${isFilled ? '' : disabled ? 'disabled' : 'pending'}">
      <div>
        <div class="timestamp-label">${icon} ${label}</div>
        <div class="timestamp-sub">${isFilled ? fmtTime(value) : disabled ? '—' : 'En attente'}</div>
      </div>
      <div class="ts-actions">
        ${isFilled ? `
          <button class="ts-btn-icon" data-action="edit-ts" data-field="${field}">✏</button>
          <button class="ts-btn filled" data-action="edit-ts" data-field="${field}">${fmtTime(value)}</button>
          ${(field === 'departDomicile' || field === 'retourDomicile') ? `
            <button class="ts-btn-icon" data-action="ts-cross" data-field="${field}" title="Remplacer par ✕ (chaînage)" style="color:var(--status-chain)">✕</button>
          ` : ''}
        ` : `
          <button class="ts-btn" data-action="ts-now" data-field="${field}" ${disabled ? 'disabled' : ''}>Maintenant</button>
          <button class="ts-btn-icon" data-action="edit-ts" data-field="${field}" ${disabled ? 'disabled' : ''}>✏</button>
        `}

// V2.9.9 — Calcul intelligent de la période "Rapport de la nuit"
// Prend en compte les weekends et jours fériés français
function computeNightPeriod() {
  const now = new Date();
  const today9h = new Date(now);
  today9h.setHours(9, 0, 0, 0);
  
  // Si on a un override custom, on l'utilise
  if (view.nightPeriodOverride) {
    return view.nightPeriodOverride;
  }
  
  // Calcul des jours fériés français pour l'année en cours
  const feries = getJoursFeriesFrance(now.getFullYear());
  
  // On part de "ce matin 9h" (ou hier 9h si on est avant 9h ce matin)
  let endDate = new Date(today9h);
  if (now < today9h) {
    // Il est avant 9h, donc le rapport va jusqu'à 9h ce matin
    // (déjà ok)
  }
  
  // Reculer pour trouver le début de la période
  // On part du jour précédent et on remonte tant qu'on tombe sur :
  // - Un samedi (jour 6)
  // - Un dimanche (jour 0)
  // - Un jour férié
  let startDate = new Date(endDate);
  startDate.setDate(startDate.getDate() - 1);
  
  // Le début de période est à 18h pour les jours de semaine, ou 17h pour le vendredi qui démarre un weekend
  // Donc on part par défaut à 18h hier et on remonte si besoin
  startDate.setHours(18, 0, 0, 0);
  
  // Tant que le jour AVANT startDate est un weekend ou férié, on recule
  // Mais attention : si on commence par exemple le mardi, on veut juste 18h lundi
  // Si on commence le lundi (après un weekend), on veut vendredi 17h
  
  let dayBefore = new Date(startDate);
  dayBefore.setDate(dayBefore.getDate() - 1);
  
  while (true) {
    const dayBeforeMidnight = new Date(dayBefore);
    dayBeforeMidnight.setHours(0, 0, 0, 0);
    
    const isWeekend = dayBeforeMidnight.getDay() === 0 || dayBeforeMidnight.getDay() === 6;
    const isFerie = isJourFerie(dayBeforeMidnight, feries);
    
    if (!isWeekend && !isFerie) break;
    
    // On recule d'un jour
    startDate = new Date(dayBefore);
    startDate.setHours(0, 0, 0, 0);
    dayBefore.setDate(dayBefore.getDate() - 1);
  }
  
  // Si le jour de startDate est vendredi (5), on démarre à 17h (début de weekend)
  // Si c'est un autre jour, on démarre à 18h
  if (startDate.getDay() === 5) {
    startDate.setHours(17, 0, 0, 0);
  } else {
    startDate.setHours(18, 0, 0, 0);
  }
  
  // Détecter si c'est un weekend ou une nuit simple
  const durationHours = (endDate - startDate) / 3600000;
  const isWeekend = durationHours > 24;
  
  return {
    start: startDate,
    end: endDate,
    label: isWeekend ? 'Rapport du week-end' : 'Rapport de la nuit',
    subtitle: `${fmtDateShort(startDate)} ${String(startDate.getHours()).padStart(2,'0')}h → ${fmtDateShort(endDate)} ${String(endDate.getHours()).padStart(2,'0')}h`,
    icon: isWeekend ? '🌴' : '🌙'
  };
}

// V2.9.9 — Jours fériés France (calcul automatique avec Pâques)
function getJoursFeriesFrance(year) {
  // Calcul de Pâques (algorithme de Butcher)
  const a = year % 19;
  const b = Math.floor(year / 100);
  const c = year % 100;
  const d = Math.floor(b / 4);
  const e = b % 4;
  const f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4);
  const k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  
  const easter = new Date(year, month - 1, day);
  
  // Lundi de Pâques = Pâques + 1
  const lundiPaques = new Date(easter); lundiPaques.setDate(lundiPaques.getDate() + 1);
  // Ascension = Pâques + 39
  const ascension = new Date(easter); ascension.setDate(ascension.getDate() + 39);
  // Pentecôte (lundi) = Pâques + 50
  const pentecote = new Date(easter); pentecote.setDate(pentecote.getDate() + 50);
  
  return [
    new Date(year, 0, 1),    // Jour de l'an
    lundiPaques,             // Lundi de Pâques
    new Date(year, 4, 1),    // Fête du travail
    new Date(year, 4, 8),    // Victoire 1945
    ascension,               // Ascension
    pentecote,               // Lundi de Pentecôte
    new Date(year, 6, 14),   // Fête nationale
    new Date(year, 7, 15),   // Assomption
    new Date(year, 10, 1),   // Toussaint
    new Date(year, 10, 11),  // Armistice 1918
    new Date(year, 11, 25)   // Noël
  ];
}

function isJourFerie(date, feries) {
  return feries.some(f => 
    f.getFullYear() === date.getFullYear() &&
    f.getMonth() === date.getMonth() &&
    f.getDate() === date.getDate()
  );
}

// Permet à l'utilisateur de modifier la période du rapport de nuit
async function editRapportPeriodeCustom() {
  const current = computeNightPeriod();
  const startStr = await showPrompt(
    'Date/heure de début',
    'Format : JJ/MM/AAAA HH:MM',
    `${fmtDate(current.start)} ${String(current.start.getHours()).padStart(2,'0')}:${String(current.start.getMinutes()).padStart(2,'0')}`
  );
  if (!startStr) return;
  
  const endStr = await showPrompt(
    'Date/heure de fin',
    'Format : JJ/MM/AAAA HH:MM',
    `${fmtDate(current.end)} ${String(current.end.getHours()).padStart(2,'0')}:${String(current.end.getMinutes()).padStart(2,'0')}`
  );
  if (!endStr) return;
  
  try {
    const parseDate = (str) => {
      const [datePart, timePart] = str.trim().split(' ');
      const [d, m, y] = datePart.split('/');
      const [h, mi] = timePart.split(':');
      return new Date(y, m - 1, d, h, mi, 0, 0);
    };
    
    const start = parseDate(startStr);
    const end = parseDate(endStr);
    
    if (isNaN(start) || isNaN(end) || start >= end) {
      toast('Dates invalides', 'error');
      return;
    }
    
    view.nightPeriodOverride = {
      start, end,
      label: 'Rapport personnalisé',
      subtitle: `${fmtDateShort(start)} ${String(start.getHours()).padStart(2,'0')}h → ${fmtDateShort(end)} ${String(end.getHours()).padStart(2,'0')}h`,
      icon: '⏰'
    };
    toast('Période modifiée', 'success');
    render();
  } catch (e) {
    toast('Format de date invalide', 'error');
  }
}

// ----- STATS -----
function renderStats() {
  // V2.9.9 — Navigation entre semaines
  const offset = view.statsWeekOffset || 0;
  const baseDate = new Date();
  baseDate.setDate(baseDate.getDate() + offset * 7);
  const week = getAstreinteWeek(baseDate);
  const weekDossiers = getWeekDossiers(offset);
  const totalKm = weekDossiers.reduce((s, d) => s + (parseFloat(d.km) || 0), 0);
  
  // V2.9.3 — Algorithme tolérant aux dates incohérentes
  // Calcul par groupes en se basant sur l'ORDRE des dossiers (par dateAppel) et non les dates des timestamps
  let totalMsClos = 0;
  let totalMsEnCours = 0;
  let nbSeqOuvertes = 0;
  let earliestOpenDepart = null;
  
  // Helper pour calculer une durée avec gestion auto du passage minuit
  function safeDiff(start, end) {
    if (!start || !end) return 0;
    const startDate = new Date(start);
    const endDate = new Date(end);
    let ms = endDate - startDate;
    
    // Si négatif (passage minuit avec date erronée), on prend juste les heures HH:MM et on suppose +1 jour
    if (ms < 0) {
      // Utiliser uniquement HH:MM:SS pour faire le calcul
      const startMin = startDate.getHours() * 60 + startDate.getMinutes();
      const endMin = endDate.getHours() * 60 + endDate.getMinutes();
      let diffMin = endMin - startMin;
      if (diffMin < 0) diffMin += 24 * 60; // Passage minuit
      ms = diffMin * 60 * 1000;
    }
    
    // Si > 24h, on suppose une mauvaise date → on prend juste les heures
    if (ms > 24 * 3600 * 1000) {
      const startMin = startDate.getHours() * 60 + startDate.getMinutes();
      const endMin = endDate.getHours() * 60 + endDate.getMinutes();
      let diffMin = endMin - startMin;
      if (diffMin < 0) diffMin += 24 * 60;
      ms = diffMin * 60 * 1000;
    }
    
    return ms;
  }
  
  const sortedWeek = [...weekDossiers].sort((a, b) => new Date(a.dateAppel) - new Date(b.dateAppel));
  
  // Construction des groupes de chaînage
  let currentGroup = null;
  const groups = [];
  
  for (const d of sortedWeek) {
    if (d.type !== 'deplacement') continue;
    
    if (d.departDomicile && d.departDomicile !== 'X') {
      // Nouveau groupe
      if (currentGroup) groups.push(currentGroup);
      currentGroup = { dossiers: [d], firstDepart: d.departDomicile, lastRetour: null };
    } else if (d.departDomicile === 'X' && currentGroup) {
      // Continuation
      currentGroup.dossiers.push(d);
    } else if (d.departDomicile === 'X' && !currentGroup) {
      // Chaînage entrant orphelin : on l'ignore pour le total (incohérence de saisie)
      continue;
    } else if (!d.departDomicile && d.retourDomicile && d.retourDomicile !== 'X') {
      // Cas spécial : retour rempli mais pas de départ → on l'ajoute au groupe en cours
      if (currentGroup) {
        currentGroup.dossiers.push(d);
        currentGroup.lastRetour = d.retourDomicile;
        groups.push(currentGroup);
        currentGroup = null;
      }
    }
    
    if (d.retourDomicile && d.retourDomicile !== 'X' && currentGroup) {
      currentGroup.lastRetour = d.retourDomicile;
      groups.push(currentGroup);
      currentGroup = null;
    }
  }
  if (currentGroup) groups.push(currentGroup);
  
  for (const g of groups) {
    if (g.firstDepart && g.lastRetour) {
      totalMsClos += safeDiff(g.firstDepart, g.lastRetour);
    } else if (g.firstDepart && !g.lastRetour) {
      totalMsEnCours += safeDiff(g.firstDepart, new Date());
      nbSeqOuvertes++;
      if (!earliestOpenDepart || new Date(g.firstDepart) < new Date(earliestOpenDepart)) {
        earliestOpenDepart = g.firstDepart;
      }
    }
  }
  
  const totalMsCombine = totalMsClos + totalMsEnCours;
  const interventions = weekDossiers.filter(d => d.type === 'deplacement').length;
  const appels = weekDossiers.filter(d => d.type === 'telephone').length;
  
  function tempsAffiche(d, idx, arr) {
    if (d.departDomicile && d.departDomicile !== 'X' && d.retourDomicile && d.retourDomicile !== 'X') {
      return fmtDuration(safeDiff(d.departDomicile, d.retourDomicile));
    }
    if (d.departDomicile && d.departDomicile !== 'X' && d.retourDomicile === 'X') {
      return '🔗 début';
    }
    if (d.departDomicile === 'X' && d.retourDomicile === 'X') {
      return '🔗 milieu';
    }
    if (d.departDomicile === 'X' && d.retourDomicile && d.retourDomicile !== 'X') {
      return '🔗 fin';
    }
    if (d.type === 'telephone') return '☎';
    return '—';
  }
  
  const now = new Date();
  const nowTime = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
  
  return `
    <header class="app-header">
      <div class="header-top">
        <div style="flex:1">
          <div class="header-title">Statistiques</div>
          <div class="header-subtitle">${state.settings.technicien || 'AMI2S'}</div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="icon-btn" data-action="stats-prev-week" title="Semaine précédente">‹</button>
          <button class="icon-btn" data-action="stats-next-week" title="Semaine suivante" ${offset >= 0 ? 'disabled style="opacity:0.3"' : ''}>›</button>
        </div>
      </div>
    </header>
    
    <div class="form-screen">
      <!-- Bandeau semaine sélectionnée -->
      <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-size:11px;color:var(--text-secondary);font-weight:600;text-transform:uppercase;letter-spacing:0.5px">
            Semaine n°${week.weekNumber}${offset === 0 ? ' (actuelle)' : offset === -1 ? ' (précédente)' : offset < 0 ? ` (il y a ${-offset} sem.)` : ''}
          </div>
          <div style="font-size:13px;color:var(--text);font-family:'JetBrains Mono',monospace;margin-top:2px">
            ${fmtDateShort(week.start)} 09h → ${fmtDateShort(week.end)} 09h
          </div>
        </div>
        ${offset !== 0 ? `<button class="btn-link" data-action="stats-current-week" style="font-size:12px;color:var(--accent);font-weight:600;background:none;border:none;cursor:pointer">Actuelle</button>` : ''}
      </div>
      <!-- Total payé combiné -->
      <div class="stat-card accent" style="grid-column:1 / -1;padding:20px;margin-bottom:8px">
        <div class="stat-value" style="font-size:38px">${totalMsCombine ? fmtDuration(totalMsCombine) : '—'}</div>
        <div class="stat-label">Total payé ${nbSeqOuvertes > 0 ? '(estimé, en cours)' : ''}</div>
        ${(totalMsClos > 0 || nbSeqOuvertes > 0) ? `
          <div style="margin-top:12px;display:flex;justify-content:space-around;gap:8px;font-size:11px;font-family:'JetBrains Mono',monospace">
            <div style="flex:1;text-align:center;padding:6px;background:var(--bg-elevated);border-radius:var(--radius-sm)">
              <div style="color:var(--status-success);font-weight:700;font-size:14px">${totalMsClos > 0 ? fmtDuration(totalMsClos) : '—'}</div>
              <div style="color:var(--text-secondary);font-size:10px;margin-top:2px">✅ clôturé</div>
            </div>
            ${nbSeqOuvertes > 0 ? `
              <div style="flex:1;text-align:center;padding:6px;background:var(--status-chain-bg);border-radius:var(--radius-sm)">
                <div style="color:var(--status-chain);font-weight:700;font-size:14px">${fmtDuration(totalMsEnCours)}</div>
                <div style="color:var(--text-secondary);font-size:10px;margin-top:2px">🟠 en cours ⏱</div>
              </div>
            ` : ''}
          </div>
          ${earliestOpenDepart ? `
            <div style="margin-top:8px;text-align:center;font-size:10px;color:var(--text-tertiary);font-family:'JetBrains Mono',monospace">
              Séquence en cours depuis ${fmtDate(earliestOpenDepart)} ${fmtTime(earliestOpenDepart)} • Maintenant : ${nowTime}
            </div>
          ` : ''}
        ` : ''}
      </div>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">${weekDossiers.length}</div>
          <div class="stat-label">Dossiers</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${interventions}</div>
          <div class="stat-label">Interventions</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${appels}</div>
          <div class="stat-label">Appels résolus</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${totalKm.toFixed(0)}</div>
          <div class="stat-label">Kilomètres</div>
        </div>
      </div>
      
      <div class="section">
        <div class="section-title">Dossiers de la semaine</div>
        ${weekDossiers.length === 0 ? `
          <div style="padding:24px;text-align:center;color:var(--text-tertiary);font-size:13px">
            Aucun dossier cette semaine
          </div>
        ` : sortedWeek.slice().reverse().map((d, idx, arr) => `
